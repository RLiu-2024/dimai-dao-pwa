<script>
const DATA = [{"seq":1,"name":"乾為天","hex":"䷀","gl":"NNNNNN","upn":"乾","upa":"金","lon":"乾","loa":"金","gs":"金","tg":"金","yg":"金","jw":"元亨利貞。","yuan":"此卦出現，官人逢之舉步青雲，心想事成，發達時往往比平常快，且越級晉升。\n\n商人逢之，為做生意當老闆之人，財多祿豐，領導統御手段來自天生好手，能當機立斷，掌握時機，成就不可限量。\n\n對於家庭，有強烈之責任感，為一良好丈夫，賢能的父親，但須切記，必須正名之人，即其正式負責人居之，乃可成此卦。如為未婚人，不可能出現此卦。所以在陽宅之出現時機必在婚後，居此位且堅心到底，必有大成就，例如總統也是由公務員做起，其特性在其始終如一在此路上持之以恆，方可達到，今人常變工作，終日忙於找尋適合自己的工作，結果必終身無成就。所以吾人在知曉此一真理之後，向求教之人說服其能居乾為天之卦位，則其心念必能成為一堅持到底之人，舉凡世上有成就之人，其一生絕不輕易離開其位，堅守原則，認清自己的實力，知道自己要追尋什麼，生命的意義，能一目了然，擺脫了財富名利之慾，人能無欲則剛，乃天經地義之事，加之深謀遠慮，知所進退，當必有所成。\n\n吾人之定位，其目的在讓人能明瞭知所進退，存亡之機，讀易不過如此，許多人知道且發表言論來提示人們如何拿捏的準，表示已瞭解到其重要性，但往往人性在聽時煞有其事的似乎瞭解了，可是事情一來卻什麼都忘了，有的人天生好手，在後天培養之下，乃能做到，但並非每一人都可如此，所以我們利用陽宅來定位，就如同電腦鎖定之後，其自然演生之過程，造成其為天生好手在事機之來時一舉一動，都很適時的令自己不逾越已份，知所進退，其成就必能過於常人。\n\n我常苦口婆心的勸人居定位，有時甚而疾聲厲呼的要求，希望他好，但改位的動作，卻不一定都會去做，只好看個人的福份了。\n\n總不能每一位上門求教的人，我都把易經八卦重講一遍，使其瞭解到其重要性，可改變一生，使明天更美好，對不對？","tuan":"大哉乾元，萬物資始，乃統天。云行雨施，品物流形。大明始終，六位時成，時乘六龍以御天。乾道變化，各正性命，保合大和，乃利貞。首出庶物，萬國咸寧。","yao":["初九：潛龍，勿用。","九二：見龍再田，利見大人。","九三：君子終日乾乾，夕惕若，厲無咎。","九四：或躍在淵，無咎。","九五：飛龍在天，利見大人。","上九：亢龍有悔。","用九：見群龍無首，吉。"],"xiang_da":"天行健，君子以自疆不息。","xiang_xiao":["潛龍勿用，陽在下也。","見龍再田，德施普也。","終日乾乾，反復道也。","或躍在淵，進無咎也。","飛龍在天，大人造也。","亢龍有悔，盈不可久也。","用九，天德不可為首也。"],"composition":"乾上乾下","pinyin":"Qián shàng Qián xià"},{"seq":2,"name":"坤為地","hex":"䷁","gl":"YYYYYY","upn":"坤","upa":"土","lon":"坤","loa":"土","gs":"土","tg":"土","yg":"土","jw":"元亨,利牝馬之貞。君子有攸往,先迷後得主,利。","yuan":"此格在陽宅上出現，就如易之言地厚能載物一樣，已婚女人才有，其包含寡居，且有子女同住，此局方現。\n\n代表意義為婚姻主破散，孤軍奮戰，肩負一家之重任，夫宮不得志造成此果，如以事業上論，則官家掌權，商人賺錢易如反掌，女中強人型，其志過丈夫，無人能及，但缺點為到老孤單無子女願居身側，因個性會趨於孤僻。\n\n婚破後，不再有婚，何時婚破須看命，運只有佔一半並非全部。即令有對象出現，不過只能同居，而於婚姻，將不再有第二次，這是肯定的。\n\n此卦禁忌在其出現後，公司行號必須正妻之名，即女人當家方有成就，很多人公司負責人為丈夫，惟乾卦可行，但卻居坤位，始成破格，終必敗的。故如有一女人家，只要事業，只要健康，對於婚姻因前次之失敗，已無興趣再婚者，此卦對其大利，終其一生成就很大，財祿無缺，到老平安，必無夫之牽掛，此時男人對她來說只是負擔，終無所助。老來近於宗教，行善之人。","tuan":"至哉坤元，萬物資生，乃順承天。坤厚載物，德合無疆。含弘光大，品物咸亨。牝馬地類，行地無疆，柔順利貞。君子攸行，先迷失道，后順得常。西南得朋，乃與類行﹔東北喪朋，乃終有慶。安貞之吉，應地無疆。","yao":["初六：履霜，堅冰至。","六二：直，方，大，不習無不利。","六三：含章可貞。或從王事，無成有終。","六四：括囊﹔無咎，無譽。","六五：黃裳，元吉。","上六：戰龍於野，其血玄黃。","用六：利永貞。"],"xiang_da":"地勢坤，君子以厚德載物。","xiang_xiao":["履霜堅冰，陰始凝也。馴致其道，至堅冰也。","六二之動，直以方也。不習無不利，地道光也。","含章可貞﹔以時發也。或從王事，知光大也。","括囊無咎，慎不害也。","黃裳元吉，文在中也。","戰龍於野，其道窮也。","用六永貞，以大終也。"],"composition":"坤上坤下","pinyin":"Kūn shàng Kūn xià"},{"seq":3,"name":"水雷屯","hex":"䷂","gl":"YNYNNY","upn":"坎","upa":"水","lon":"震","loa":"木","gs":"水","tg":"木","yg":"水","jw":"元亨,利貞。勿用有攸往,利建侯。","yuan":"此卦為次子卦，時機在長子未婚，且同居一處，方可論之，一旦長子或本人結婚，此局立消，切記。\n\n次子居此，則比長子早婚，比同時出生之人早二年結婚，但有禁忌，如肖狗或狄姓之人，主夭折，此卦大凶，又逢犬年加凶，肖牛人，必任妻擺佈，背離家庭，不顧父母。所以如其他人成此局，只不過早婚而已，對犬、牛人主凶，不利。\n\n屯卦有一運用，在家族事業，世代交替時，父必使次子繼位長子失寵，其運如此，吾人觀命時，必可發現，次子之事業必優於長子，才智能力超越長子多多，自然而然居此局，故吾人入宅如發現此局，反過來看，亦可得到很正確之結論，所以命運同參，方可瞭解同時生人之結果不同，即令同時生人都為次子，且長子屬肖也同，但卻不一定長兄生時皆亦同，差異即在此。\n\n次子越位，志過長兄局已定出，個性上亦同。","tuan":"屯，剛柔始交而難生，動乎險中，大亨貞。雷雨之動滿盈，天造草昧，宜建侯而不寧。","yao":["初九：磐桓﹔利居貞，利建侯。","六二：屯如邅如，乘馬班如。匪寇婚媾，女子貞不字，十年乃字。","六三：既鹿無虞，惟入于林中，君子几不如舍，往吝。","六四：乘馬班如，求婚媾，無不利。","九五：屯其膏，小貞吉，大貞凶。","上六：乘馬班如，泣血漣如。"],"xiang_da":"云，雷，屯﹔君子以經綸。","xiang_xiao":["雖磐桓，志行正也。以貴下賤，大得民也。","六二之難，乘剛也。十年乃字，反常也。","既鹿無虞，以縱禽也。君子舍之，往吝窮也。","求而往，明也。","屯其膏，施未光也。","泣血漣如，何可長也。"],"composition":"坎上震下","pinyin":"Kǎn shàng Zhèn xià"},{"seq":4,"name":"山水蒙","hex":"䷃","gl":"NYYNYN","upn":"艮","upa":"土","lon":"坎","loa":"水","gs":"土","tg":"水","yg":"土","jw":"亨。匪我求童蒙,童蒙求我。初筮告,再三瀆,瀆則不告。利貞。","yuan":"陽宅上此局出現，必有三子居家中，且未婚，排行第三兒子，出此局其造成：一、以蒙蔽之法欺家人，惟利是圖。\n\n二、本身愚昧，不知進退。\n\n三、性剛不聽兄長之言，獨行獨斷。\n\n四、較次子早婚，較長子晚婚。\n\n五、比同時生人早七年婚。\n\n六、常喜賭博性之錢祿，故往往求財遇險之象。\n\n吾人入宅發現此局，當及早對其改局，惟有使他本人想通，方可助他，否則即令父母耳提面命，亦於事無補，成敗在一念之間耳。\n\n蒙之生，由已之念，俗言：二片葉子放在眼前，泰山也看不到了。可見一念之差，距離有如此遠，更遑論可能誤一世，待後悔後，已是百年身矣。抱持僥倖心理之人是最要不得的，你不會有第二次機會再來過的，切記！切記！","tuan":"蒙，山下有險，險而止，蒙。蒙亨，以亨行時中也。匪我求童蒙，童蒙求我，志應也。初噬告，以剛中也。再三瀆，瀆則不告，瀆蒙也。蒙以養正，聖功也。","yao":["初六：發蒙，利用刑人，用說桎梏，以往吝。","九二：包蒙吉﹔納婦吉﹔子克家。","六三：勿用娶女﹔見金夫，不有躬，無攸利。","六四：困蒙，吝。","六五：童蒙，吉。","上九：擊蒙﹔不利為寇，利御寇。"],"xiang_da":"山下出泉，蒙﹔君子以果行育德。","xiang_xiao":["利用刑人，以正法也。","子克家，剛柔接也。","勿用娶女，行不順也。","困蒙之吝，獨遠實也。","童蒙之吉，順以巽也。","利用御寇，上下順也。蒙"],"composition":"艮上坎下","pinyin":"Gèn shàng Kǎn xià"},{"seq":5,"name":"水天需","hex":"䷄","gl":"YNNNYN","upn":"坎","upa":"水","lon":"乾","loa":"金","gs":"水","tg":"金","yg":"水","jw":"有孚,光亨,貞吉。利涉大川。","yuan":"此卦出現，代表其人智慧成長快速，勢必超越同年紀同時生人多多，且個性剛烈，不受建言，須注意，如長兄一旦結婚，此局立消，局自長兄婚之日始，立變為雷天大壯收局。\n\n需卦局所表現的意義如後：一、婚事延後七年，且單歲婚。\n\n二、如逢八字中，喜慶逢凶，必入宗教或不婚。\n\n三、婚時，妻必為改嫁之人。\n\n四、於事業上，必有大成，年少居權位，受重用，進退有據。","tuan":"需，須也﹔險在前也。剛健而不陷，其義不困窮矣。需有孚，光亨，貞吉。位乎天位，以正中也。利涉大川，往有功也。","yao":["初九：需于郊。利用恆，無咎。","九二：需于沙。小有言，終吉。","九三：需于泥，致寇至。","六四：需于血，出自穴。","九五：需于酒食，貞吉。","上六：入于穴，有不速之客三人來，敬之終吉。"],"xiang_da":"云上於天，需﹔君子以飲食宴樂。","xiang_xiao":["需于郊，不犯難行也。利用恆，無咎﹔未失常也。","需于沙，衍在中也。雖小有言，以終吉也。","需于泥，災在外也。自我致寇，敬慎不敗也。","需于血，順以聽也。","酒食貞吉，以中正也。","不速之客來，敬之終吉。雖不當位，未大失也。需"],"composition":"坎上乾下","pinyin":"Kǎn shàng Qián xià"},{"seq":6,"name":"天水訟","hex":"䷅","gl":"NNYNYY","upn":"乾","upa":"金","lon":"坎","loa":"水","gs":"金","tg":"水","yg":"金","jw":"有孚,窒。惕中吉。終兇。利見大人,不利涉大川。","yuan":"此局令人官司不斷，訴訟纏身，或為好訟之徒。一旦離婚此局方破，否則你只好改變臥房位置，方可脫離此局之限。\n\n一、官人居此局，升官慢五年，諸事不順，即令不違法，亦受他人連累。\n\n二、商人居此局，財祿不進，必須興訟方可得財。\n\n三、夫妻婚姻主破，訴訟離婚，此須看命，如命中有，則必成格；如命中沒有，則不成格。\n\n四、專業人士如醫師，會計師等居此局，千萬須防訟事來臨，流年逢之，同時生人沒事，而你必生事端，運氣不好使然。","tuan":"訟，上剛下險，險而健訟。訟有孚窒，惕中吉，剛來而得中也。終凶﹔訟不可成也。利見大人﹔尚中正也。不利涉大川﹔入于淵也。","yao":["初六：不永所事，小有言，終吉。","九二：不克訟，歸而逋，其邑人三百戶，無眚。","六三：食舊德，貞厲，終吉，或從王事，無成。","九四：不克訟，復自命，渝安貞，吉。","九五：訟元吉。","上九：或錫之鞶帶，終朝三褫之。"],"xiang_da":"天與水違行，訟﹔君子以作事謀始。","xiang_xiao":["不永所事，訟不可長也。雖有小言，其辯明也。","不克訟，歸而逋也。自下訟上，患至掇也。","食舊德，從上吉也。","復即命，渝安貞﹔不失也。","訟元吉，以中正也。","以訟受服，亦不足敬也。"],"composition":"乾上坎下","pinyin":"Qián shàng Kǎn xià"},{"seq":7,"name":"地水師","hex":"䷆","gl":"YYYNYN","upn":"坤","upa":"土","lon":"坎","loa":"水","gs":"土","tg":"水","yg":"土","jw":"貞,丈人吉,無咎。","yuan":"此局大異其趣，吾人常見潑婦罵街，女人性剛，甚而與人毆打，其局如此，生人如此，亦為妙矣。\n\n當你發現母親如此，兇暴，易與人起爭端，仇視外人，其皆由此局產生的，當須化解，方可平安。\n\n一、對婚事必凶，有妻毆夫之象。\n\n二、事業上，亦不得志，常生糾紛，男命女身。\n\n壹拾贰三、獨來獨往，膽大過人。\n\n四、從商主破婚，得財，尤利虎、馬、羊三人，其商機、官運亨通，但婚則凶，各有利弊。\n\n其與同時生之人或雙胞胎大異其趣，各方面皆不同。","tuan":"師，眾也，貞正也，能以眾正，可以王矣。剛中而應，行險而順，以此毒天下，而民從之，吉又何咎矣。","yao":["初六：師出以律，否臧凶。","九二：在師中，吉無咎，王三錫命。","六三：師或輿尸，凶。","六四：師左次，無咎。","六五：田有禽，利執言，無咎。長子帥師，弟子輿尸，貞凶。","上六：大君有命，開國承家，小人勿用。"],"xiang_da":"地中有水，師﹔君子以容民畜眾。","xiang_xiao":["師出以律，失律凶也。","在師中吉，承天寵也。王三錫命，懷萬邦也。","師或輿尸，大無功也。","左次無咎，未失常也。","長子帥師，以中行也。弟子輿師，使不當也。","大君有命，以正功也。小人勿用，必亂邦也。師"],"composition":"坤上坎下","pinyin":"Kūn shàng Kǎn xià"},{"seq":8,"name":"水地比","hex":"䷇","gl":"YNYNNY","upn":"坎","upa":"水","lon":"坤","loa":"土","gs":"水","tg":"土","yg":"水","jw":"吉。原筮,元永貞,無咎。不寧方來,後夫兇。","yuan":"此卦出現，須長兄為未婚，一旦長兄婚，此局立變為豫卦，須注意變局將如何，則看長兄之命，何時有婚，知何時生變局，此即陽宅上可見未來之象。\n\n此卦有親比之意。\n\n一、性喜從母事，且任勞任怨，家事一手包辦，與母連心。\n\n二、適婚年齡到時，喜歡比自己年長於己之女人，如命中同時生人為二十八歲婚，但此局人婚必延後三年到三十一歲才婚，且娶年長於己之女人方合格，否則婚主破散，不出一年。\n\n三、如命中主破，婚事不成，再居此局，則終身不娶，且與有婚或離婚之女有來往，終無果也。\n\n四、事業上則居佐才之位，無法任職主管。\n\n五、商場上亦為人工作，不為老闆，同時生人有可能為很成功的老闆，但命只居三才之三分之一，運的局影響，使其終身不得志，且與同時生人有不同之結果。\n\n唯俟長子成婚後，局方可改變，如長兄居側，或認乾兄，此局勢必難變。","tuan":"比，吉也，比，輔也，下順從也。原筮元永貞，無咎，以剛中也。不寧方來，上下應也。后夫凶，其道窮也。","yao":["初六：有孚比之，無咎。有孚盈缶，終來有他，吉。","六二：比之自內，貞吉。","六三：比之匪人。","六四：外比之，貞吉。","九五：顯比，王用三驅，失前禽。邑人不誡，吉。","上六：比之無首，凶。"],"xiang_da":"地上有水，比﹔先王以建萬國，親諸侯。","xiang_xiao":["比之初六，有他吉也。","比之自內，不自失也。","比之匪人，不亦傷乎！","外比於賢，以從上也。","顯比之吉，位正中也。舍逆取順，失前禽也。邑人不誡，上使中也。","比之無首，無所終也。比"],"composition":"坎上坤下","pinyin":"Kǎn shàng Kūn xià"},{"seq":9,"name":"風天小畜","hex":"䷈","gl":"NNYNNN","upn":"巽","upa":"木","lon":"乾","loa":"金","gs":"木","tg":"金","yg":"木","jw":"亨。密雲不雨,自我西郊。","yuan":"此卦局，著重於事業，不重於婚姻，凡家有女兒皆易成此局，卦局之判讀，請參閱錄影教學帶，此處不言。\n\n一、女代父職，且能力強過男人，獨立自主，不依賴他人。\n\n二、事業企圖心旺盛，早年為老闆，事業有成。\n\n三、婚事方面，須與命同參，如同時生人為二十八歲婚，而此陽宅局之人會提前二年結婚。如同時生人婚姻不成主有婚必破，此局之人必終身不嫁，全心在事業上發展，成為一女強人。\n\n此局大利肖羊、馬之人，但即令有婚，夫亦無力助之，全靠一己之力獨撐大局。","tuan":"小畜﹔柔得位，而上下應之，曰小畜。健而巽，剛中而志行，乃亨。密云不雨，尚往也。自我西郊，施未行也。","yao":["初九：復自道，何其咎，吉。","九二：牽復，吉。","九三：輿說輻，夫妻反目。","六四：有孚，血去惕出，無咎。","九五：有孚攣如，富以其鄰。","上九：既雨既處，尚德載，婦貞厲。月几望，君子征凶。"],"xiang_da":"風行天上，小畜﹔君子以懿文德。","xiang_xiao":["復自道，其義吉也。","牽復在中，亦不自失也。","夫妻反目，不能正室也。","有孚惕出，上合志也。","有孚攣如，不獨富也。","既雨既處，德積載也。君子征凶，有所疑也。小畜"],"composition":"巽上乾下","pinyin":"Xùn shàng Qián xià"},{"seq":10,"name":"天澤履","hex":"䷉","gl":"NNNYNN","upn":"乾","upa":"金","lon":"兑","loa":"金","gs":"金","tg":"金","yg":"金","jw":"履虎尾,不咥人,亨。","yuan":"女人無履，唯男人有之，此局可見男女之本性不同，女人外似柔弱但一遇進退兩難之時，卻往往比男人果決，男人外似剛強，但遇險事卻往往躑躅不前，成履卦。\n\n一、事業上常有欲進不得，退之又凶，居進退兩難之局，其事勢如此，而其性亦如此，其解常靠女人決定之。\n\n二、官運不通，停滯不前。\n\n三、商機不利，運氣不佳，取捨之間，因時機已誤，喪失良好機會，徒於事懊惱而已，於事無補。\n\n四、婚事方面，妻能力過於己，故有在外娶妾之行為，以求恢復男人之自信心、自尊心，故於婚姻主凶。同時生人如命中婚姻不散則感情破裂，終而同床異夢，但如命中，主婚姻破裂，再加運上此局，則必主破散無救。此同時生人之不同處，流年不同之因也。","tuan":"履，柔履剛也。說而應乎乾，是以履虎尾，不咥人，亨。剛中正，履帝位而不疚，光明也。","yao":["初九：素履，往無咎。","九二：履道坦坦，幽人貞吉。","六三：眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。","九四：履虎尾，愬愬終吉。","九五：夬履，貞厲。","上九：視履考祥，其旋元吉。"],"xiang_da":"上天下澤，履﹔君子以辨上下，安民志。","xiang_xiao":["素履之往，獨行愿也。","幽人貞吉，中不自亂也。","眇能視﹔不足以有明也。跛能履﹔不足以與行也。咥人之凶﹔位不當也。武人為于大君﹔志剛也。","愬愬終吉，志行也。","夬履貞厲，位正當也。","元吉在上，大有慶也。"],"composition":"乾上兑下","pinyin":"Qián shàng Duì xià"},{"seq":11,"name":"地天泰","hex":"䷊","gl":"YYYNNN","upn":"坤","upa":"土","lon":"乾","loa":"金","gs":"土","tg":"金","yg":"土","jw":"小往大來,吉,亨。","yuan":"此名為泰卦，有否極泰來，安泰舒適之象。每逢有已婚女向本人求教之時，我都以此卦教之，令改，促進夫妻和睦乃吾道中人之一大職責，此功德無量。\n\n此局大吉，無論於婚姻、事業、健康及教育子女上，都有卓越之表現，為一賢妻良母。\n\n一、於婚姻，主一世夫妻，白首到老。\n\n二、於事業，在家相夫教子亦為事業。在公事上，進退有據，受人重用，必不待言，其心想事成。\n\n三、於健康主平安到老，一生無大病痛，凡未經指點，能得此局之人，必屬大富大貴之人，福厚之人，一生無災，常見命格好之人，自然居之，真所謂「福地福人居」實不為過。實務上，吾人可見命薄之人，不但無法居此，即使你告訴她有如此好，而她亦會因外在環境上之束縛，而無法改變自己，不知人與天爭，即在此，禍福在一念之間耳。唯自求多福，但希望你真能自求而生多福，但須知世事常不盡人意，如能刻意成局之人乃屬有福之人，其剛柔動靜之間，必能掌握機先，事事快人一步，終必大成。","tuan":"泰，小往大來，吉亨。則是天地交，而萬物通也﹔上下交，而其志同也。內陽而外陰，內健而外順，內君子而外小人，君子道長，小人道消也。","yao":["初九：拔茅茹，以其夤，征吉。","九二：包荒，用馮河，不遐遺，朋亡，得尚于中行。","九三：無平不陂，無往不復，艱貞無咎。勿恤其孚，于食有福。","六四：翩翩不富，以其鄰，不戒以孚。","六五：帝乙歸妹，以祉元吉。","上六：城復于隍，勿用師。自邑告命，貞吝。"],"xiang_da":"天地交泰，后以財(裁)成天地之道，輔相天地之宜，以左右民。","xiang_xiao":["拔茅征吉，志在外也。","包荒，得尚于中行，以光大也。","無往不復，天地際也。","翩翩不富，皆失實也。不戒以孚，中心愿也。","以祉元吉，中以行愿也。","城復于隍，其命亂也。泰"],"composition":"坤上乾下","pinyin":"Kūn shàng Qián xià"},{"seq":12,"name":"天地否","hex":"䷋","gl":"NNNYYY","upn":"乾","upa":"金","lon":"坤","loa":"土","gs":"金","tg":"土","yg":"金","jw":"否之匪人,不利君子貞,大往小來。","yuan":"惟男人有之，此男女本性之不同，亦可於此卦局窺見之，男人之性過剛於女，自尊好強之心，又顯現無遺，往往天性上，有欲大力小之性而不自知，不知己之才能如何，妄度不知量進，乃終成否卦。\n\n常見個性如此之人居否局，而不自知，仍自以為是，故終其一生必無成就，每日只知怨天尤人，嘆時不利己，己不逢時而已。\n\n一、於婚事主大凶，夫妻反目成仇，加上命格中如婚破，又在運宅上居此局，則勢必無法挽回。\n\n二、官家之人，必主否塞不通，終致無成，不但不升官，反招凶禍，乃致退休。\n\n三、商家人，居此局，必生大耗，財耗家散，終致一敗塗地。\n\n四、健康上亦凶，主大病纏身，如加上命中流年逢羊刃，血光必現，在數中難逃此大限之局。","tuan":"否之匪人，不利君子貞。大往小來，則是天地不交，而萬物不通也﹔上下不交，而天下無邦也。內陰而外陽，內柔而外剛，內小人而外君子。小人道長，君子道消也。","yao":["初六：拔茅茹，以其夤，貞吉亨。","六二：包承。小人吉，大人否亨。","六三：包羞。","九四：有命無咎，疇離祉。","九五：休否，大人吉。其亡其亡，系于苞桑。","上九：傾否，先否后喜。"],"xiang_da":"天地不交，否﹔君子以儉德辟難，不可榮以祿。","xiang_xiao":["拔茅貞吉，志在君也。","大人否亨，不亂群也。","包羞，位不當也。","有命無咎，志行也。","大人之吉，位正當也。","否終則傾，何可長也。否"],"composition":"乾上坤下","pinyin":"Qián shàng Kūn xià"},{"seq":13,"name":"天火同人","hex":"䷌","gl":"NNNNYN","upn":"乾","upa":"金","lon":"离","loa":"火","gs":"金","tg":"火","yg":"金","jw":"於野,亨。利涉大川,利君子貞。","yuan":"此局在陽宅上亦妙不可言，學者切勿分辨錯誤，須仔細分詳，以免誤人而不自知。\n\n一、官家人逢之，必主人和，手下得力，祿命九重來，平步青雲。\n\n壹拾陆二、商人逢之，財祿豐盛，但須二人合夥，方可成事，一人獨資勢必不成大器。\n\n三、自由業、服務業居此局，必主名氣大，聲名遠播，財祿亨通。\n\n四、對妻不利，因此局出現，妻必成明夷卦，主妻有暗傷，血光難逃，故不如乾為天，地天泰吉，即在此，不利妻之處。\n\n吾人常見夫妻一對，夫之事業如日中天，而妻子卻病災不斷必為此局之陽宅也。","tuan":"同人，柔得位得中，而應乎乾，曰同人。同人曰，同人于野，亨。利涉大川，乾行也。文明以健，中正而應，君子正也。唯君子為能通天下之志。","yao":["初九：同人于門，無咎。","六二：同人于宗，吝。","九三：伏戎于莽，升其高陵，三歲不興。","九四：乘其墉，弗克攻，吉。","九五：同人，先號啕而后笑。大師克相遇。","上九：同人于郊，無悔。"],"xiang_da":"天與火，同人﹔君子以類族辨物。","xiang_xiao":["出門同人，又誰咎也。","同人于宗，吝道也。","伏戎于莽，敵剛也。三歲不興，安行也。","乘其墉，義弗克也，其吉，則困而反則也。","同人之先，以中直也。大師相遇，言相克也。","同人于郊，志未得也。同人"],"composition":"乾上离下","pinyin":"Qián shàng Lí xià"},{"seq":14,"name":"火天大有","hex":"䷍","gl":"NYNNNN","upn":"离","upa":"火","lon":"乾","loa":"金","gs":"火","tg":"金","yg":"火","jw":"元亨。","yuan":"吾人常見有未婚之女，嬌美如花，事業上功成名就，但婚姻不好，即此局之人。\n\n一、性陽剛過人，倔強固執本性展現無遺。\n\n二、不重視婚姻，也不在乎婚姻，唯對子女獨有所鐘，有未婚生子之象，且不在乎人言，且主得二子。\n\n三、如遇命中婚姻順暢，則比同時生人要早三年成婚。\n\n四、命中事業旺，祖業大之人，再加上此局，勢必為女承父業之象，兄弟無力。\n\n肖犬之小姐居此局反之，必主大吉大利，智慧高，婚事吉，事業順利，婚後有二子雙生之象。","tuan":"大有，柔得尊位，大中而上下應之，曰大有。其德剛健而文明，應乎天而時行，是以元亨。","yao":["初九：無交害，匪咎，艱則無咎。","九二：大車以載，有攸往，無咎。","九三：公用亨于天子，小人弗克。","九四：匪其彭，無咎。","六五：厥孚交如，威如﹔吉。","上九：自天佑之，吉無不利。"],"xiang_da":"火在天上，大有﹔君子以竭惡揚善，順天休命。","xiang_xiao":["大有初九，無交害也。","大車以載，積中不敗也。","公用亨于天子，小人害也。","匪其彭，無咎﹔明辨晰也。","厥孚交如，信以發志也。威如之吉，易而無備也。","大有上吉，自天佑也。大有"],"composition":"离上乾下","pinyin":"Lí shàng Qián xià"},{"seq":15,"name":"地山謙","hex":"䷎","gl":"YYYNYY","upn":"坤","upa":"土","lon":"艮","loa":"土","gs":"土","tg":"土","yg":"土","jw":"亨,君子有終。","yuan":"謙卦九三爻位，勞謙，君子有終，有勞謙之美。史上如周公，為其代表。常見婦人，任勞任怨，居無所苦，謙以讓人，婦之賢德，表現無遺，且始終不變，即此卦局能成。\n\n一、必為賢妻良母之人無疑，但夫卦為遯，主夫妻不利，感情退化，所以常見有賢德之婦人，往往盡心盡力為家操心，結果卻無法挽回婚姻之善，但六十五歲以後不成此局。\n\n二、身體小病痛不斷，因勞成疾多有。\n\n三、官家人逢之，主遇事公平處之，一絲不茍之人。\n\n四、商家人得此局，必生財祿，但往往有股東不合，因分利不均而破壞。\n\n五、同時生人，則有官帶現，如命為公職人，但居謙卦局，有民選官之傾向，商家人亦有此傾向，會居國會殿堂之中。","tuan":"謙，亨，天道下濟而光明，地道卑而上行。天道虧盈而益謙，地道變盈而流謙，鬼神害盈而福謙，人道惡盈而好謙。謙尊而光，卑而不可逾，君子之終也。","yao":["初六：謙謙君子，用涉大川，吉。","六二：鳴謙，貞吉。","九三：勞謙君子，有終吉。","六四：無不利，撝謙。","六五：不富，以其鄰，利用侵伐，無不利。","上六：鳴謙，利用行師，征邑國。"],"xiang_da":"地中有山，謙﹔君子以裒多益寡，稱物平施。","xiang_xiao":["謙謙君子，卑以自牧也。","鳴謙貞吉，中心得也。","勞謙君子，萬民服也。","無不利，撝謙﹔不違則也。","利用侵伐，征不服也。","鳴謙，志未得也。可用行師，征邑國也。"],"composition":"坤上艮下","pinyin":"Kūn shàng Gèn xià"},{"seq":16,"name":"雷地豫","hex":"䷏","gl":"YYNYYY","upn":"震","upa":"木","lon":"坤","loa":"土","gs":"木","tg":"土","yg":"木","jw":"利建侯行師。","yuan":"成此卦局之男人，必有因祿遠行之象，大利肖馬之人。\n\n一、居家中為母助，家事瑣碎，巨細靡遺，有男人能做一手好菜即此局之人。\n\n二、事業財官雙美平步青雲，惟與六親遠離，母有先喪之象。\n\n三、婚姻延後，此同時出生之人晚五年婚。\n\n四、事業上為良佐之人，任何老闆或主管任用之後，都將得幸有此人相助。\n\n五、婚事有娶二婚妻之象，或年長於己之小姐。","tuan":"豫，剛應而志行，順以動，豫。豫，順以動，故天地如之，而況建侯行師乎？天地以順動，故日月不過，而四時不忒﹔聖人以順動，則刑罰清而民服。豫之時義大矣哉！","yao":["初六：鳴豫，凶。","六二：介于石，不終日，貞吉。","六三：盱豫，悔。遲有悔。","九四：由豫，大有得。勿疑。朋盍簪。","六五：貞疾，恆不死。","上六：冥豫，成有渝，無咎。"],"xiang_da":"雷出地奮，豫。先王以作樂崇德，殷荐之上帝，以配祖考。","xiang_xiao":["初六鳴豫，志窮凶也。","不終日，貞吉﹔以中正也。","盱豫有悔，位不當也。","由豫，大有得﹔志大行也。","六五貞疾，乘剛也。恆不死，中未亡也。","冥豫在上，何可長也。豫"],"composition":"震上坤下","pinyin":"Zhèn shàng Kūn xià"},{"seq":17,"name":"澤雷隨","hex":"䷐","gl":"YNNYYN","upn":"兑","upa":"金","lon":"震","loa":"木","gs":"金","tg":"木","yg":"金","jw":"元亨利貞,無咎。","yuan":"此卦現代人最多見，吾人常見街上有女孩，女扮男裝或粗壯過一般女人之小姐，即此局之人。\n\n一、有女同性戀之傾向，其心念一直認為自己為男人，且不屑自己為男人，且不屑一顧周圍之男人，喜與女孩同出同入。\n\n二、全心於事業，為達目的不擇手段，有時位高且居天子或董事長之身側。\n\n三、如同時生人，命中婚姻吉祥，再加此局勢必嫁入富貴人家，且比同時生人，早婚四年，如對方不富有，終必散。\n\n故學者如此，必須天文地理合局，方可確知同時生人之不同在何處，同時亦知如何可解。比方遇此卦局之人，命中婚姻又凶，吾人事先探知，利用巽為風卦，即可解開此局生成之禍端。","tuan":"隨，剛來而下柔，動而說，隨。大亨貞，無咎，而天下隨時，隨之時義大矣哉！","yao":["初九：官有渝，貞吉。出門交有功。","六二：系小子，失丈夫。","六三：系丈夫，失小子。隨有求得，利居貞。","九四：隨有獲，貞凶。有孚在道，以明，何咎。","九五：孚于嘉，吉。","上六：拘系之，乃從維之。王用亨于西山。"],"xiang_da":"澤中有雷，隨﹔君子以","xiang_xiao":["官有渝，從正吉也。出門交有功，不失也。","系小子，弗兼與也。","系丈夫，志舍下也。","隨有獲，其義凶也。有孚在道，明功也。","孚于嘉，吉﹔位正中也。","拘系之，上窮也。隨"],"composition":"兑上震下","pinyin":"Duì shàng Zhèn xià"},{"seq":18,"name":"山風蠱","hex":"䷑","gl":"NYYNNY","upn":"艮","upa":"土","lon":"巽","loa":"木","gs":"土","tg":"木","yg":"土","jw":"元亨,利涉大川。先甲三日,後甲三日。","yuan":"三蟲聚一盤中，互相爭食，此成蠱象，吾人常見幾位女性同居一桌，東家長西家短的議論他人，此雖生是非之地，但並非成蠱卦，此卦在陽宅上惟見之於男人，此又男女之不同，女人之蠱，吾人可以立見，男人之蠱在心中，表面上不易看到。\n\n一、此局男人圖利野心至大，為達目的，往往不擇手段。\n\n二、主發科甲，讀書考試成績必超人一等。\n\n三、有早婚之象，比同時生人提前四年婚，且二位兄長尚未娶妻，自己先娶。","tuan":"蠱，剛上而柔下，巽而止，蠱。蠱，元亨，而天下治也。利涉大川，往有事也。先甲三日，后甲三日，終則有始，天行也。","yao":["初六：干父之蠱，有子，考無咎，厲終吉。","九二：干母之蠱，不可貞。","九三：干父小有晦，無大咎。","六四：裕父之蠱，往見吝。","六五：干父之蠱，用譽。","上九：不事王侯，高尚其事。"],"xiang_da":"山下有風，蠱﹔君子以振民育德。","xiang_xiao":["干父之蠱，意承考也。","干母之蠱，得中道也。","干父之蠱，終無咎也。","裕父之蠱，往未得也。","干父之蠱﹔承以德也。","不事王侯，志可則也。蠱"],"composition":"艮上巽下","pinyin":"Gèn shàng Xùn xià"},{"seq":19,"name":"地澤臨","hex":"䷒","gl":"YYYYNN","upn":"坤","upa":"土","lon":"兑","loa":"金","gs":"土","tg":"金","yg":"土","jw":"元亨利貞。至於八月有兇。","yuan":"母居此局，因對象之卦為履，故有難為之象出現。已婚婦人居此由於夫宮必無力，產生以下數種狀況：一、夫業受困，乃因妻之過剛，為求功心切，招致如此，請參考履卦。\n\n二、妻為委曲求全，而以力大居小，順從於夫可也。\n\n三、子女逢母如此，任何事皆有母來做主，以致母過煩憂，發展權限過大，終致子女反彈，背逆其意行事，其招致如此，乃因母親無安全感，全心寄託在子女身上而成此特殊之心理狀況。其結果大家痛苦，而無法解決。\n\n四、肖虎人居此局，婚事凶，主破，但於事業卻能力爭上游，成就非凡。","tuan":"臨，剛浸而長。說而順，剛中而應，大亨以正，天之道也。至于八月有凶，消不久也。","yao":["初九：咸臨，貞吉。","九二：咸臨，吉無不利。","六三：甘臨，無攸利。既憂之，無咎。","六四：至臨，無咎。","六五：知臨，大君之宜，吉。","上六：敦臨，吉無咎。"],"xiang_da":"澤上有地，臨﹔君子以教思無窮，容保民無疆。","xiang_xiao":["咸臨貞吉，志行正也。","咸臨，吉無不利﹔未順命也。","甘臨，位不當也。既憂之，咎不長也。","至臨無咎，位當也。","大君之宜，行中之謂也。","敦臨之吉，志在內也。臨"],"composition":"坤上兑下","pinyin":"Kūn shàng Duì xià"},{"seq":20,"name":"風地觀","hex":"䷓","gl":"NNYYYY","upn":"巽","upa":"木","lon":"坤","loa":"土","gs":"木","tg":"土","yg":"木","jw":"盥而不薦,有孚顒若。","yuan":"觀卦之精義在以靜觀可以洞悉周圍之事，黃帝之陰符經雲：「聾者善視。」即此意。但亦有缺失，豈不聞古言：「水至清則無魚，人至明則無徒」此卦唯長女可見，婚後局消。\n\n一、其明在過明，而產生以財富論定是否願意嫁人，造成如遇贰拾未有事業之男人，即使再愛也不願結婚，寧可做有錢人的偏房，不婚。\n\n二、如逢命格婚姻有凶，則有嫁二婚夫，且對方有子之人，但須比同時生人再加六年方成正式婚姻。\n\n三、未婚前，女兒代母職，掌理一家大小之事，有姊如母，即此局之人。\n\n四、如遇命中為僧道命之人，則主終身不嫁。","tuan":"大觀在上，順而巽，中正以觀天下。觀，盥而不荐，有孚顒若，下觀而化也。觀天之神道，而四時不忒，聖人以神道設教，而天下服矣。","yao":["初六：童觀，小人無咎，君子吝。","六二：窺觀，利女貞。","六三：觀我生，進退。","六四：觀國之光，利用賓于王。","九五：觀我生，君子無咎。","上九：觀其生，君子無咎。"],"xiang_da":"風行地上，觀﹔先王以省方，觀民設教。","xiang_xiao":["初六童觀，小人道也。","窺觀女貞，亦可丑也。","觀我生，進退﹔未失道也。","觀國之光，尚賓也。","觀我生，觀民也。","觀其生，志未平也。"],"composition":"巽上坤下","pinyin":"Xùn shàng Kūn xià"},{"seq":21,"name":"火雷噬嗑","hex":"䷔","gl":"NYNYYN","upn":"离","upa":"火","lon":"震","loa":"木","gs":"火","tg":"木","yg":"火","jw":"亨,利用獄。","yuan":"成此之局法，請觀錄影帶說明，於此不累述。吾人常見有女孩小時即喜歡咬人，勸之不聽，乃生噬嗑之象。\n\n一、此女性剛，報復手段常用咬的，平日嘮叨不停。\n\n二、婚姻對象為陰柔之男人。\n\n三、本身想法動作一如男人，且主少年有成，故常見年輕之影劇圈出身小姐，名氣很大，少年得志，都屬此局。\n\n四、婚事延後六年，故同時生人如為二十六歲婚，則此局人加六年，成為三十二歲婚。\n\n五、事業非常順利，但如為肖雞之女性逢之，其果必坐吃山空，吾人常見的有未婚妾成此局，也有離婚之女成此局，但須與寡母同住一起，方成此局。為何如此，學者須看錄影帶說明。\n\n贰拾壹","tuan":"頤中有物，曰噬嗑，噬嗑而亨。剛柔分，動而明，雷電合而章。柔得中而上行，雖不當位，利用獄也。","yao":["初九：履校滅趾，無咎。","六二：噬膚滅鼻，無咎。","六三：噬臘肉，遇毒﹔小吝，無咎。","九四：噬乾胏，得金矢，利艱貞，吉。","六五：噬乾肉，得黃金，貞厲，無咎。","上九：何校滅耳，凶。"],"xiang_da":"雷電噬嗑﹔先王以明罰敕法。","xiang_xiao":["履校滅趾，不行也。","噬膚滅鼻，乘剛也。","遇毒，位不當也。","利艱貞吉，未光也。","貞厲無咎，得當也。","何校滅耳，聰不明也。"],"composition":"离上震下","pinyin":"Lí shàng Zhèn xià"},{"seq":22,"name":"山火賁","hex":"䷕","gl":"NYYNYN","upn":"艮","upa":"土","lon":"离","loa":"火","gs":"土","tg":"火","yg":"土","jw":"亨。小利有所往。","yuan":"賁卦為求外飾之道，其之於人事，惟男人居此局中成格。諸君試想一位堂堂男子漢，如果要外飾，其目的何在呢？因為有真內實之人，其心但求充實，必捨外飾之道，不會花心思刻意去修飾。君不見真正有錢，有高智慧之人，其外觀往往很零亂，甚至衣服反穿而不自知，其原因在他根本不想花心思在這方面，你有同感嗎？\n\n一、男身女態之象，性喜誇張矯作之服飾。\n\n二、個性好動，不耐靜守，又剛烈主見強，性易怒。\n\n三、婚姻延後，三十歲以後進退失據，吾人常見空服人員及影劇圈人士居此局中而不自知。\n\n四、此局以科甲，聲名，故利考試。同時生人會考試成績不同，有人名落孫山，地理之格局影響深遠矣。","tuan":"賁，亨﹔柔來而文剛，故亨。分剛上而文柔，故小利有攸往。天文也﹔文明以止，人文也。觀乎天文，以察時變﹔觀乎人文，以化成天下。","yao":["初九：賁其趾，舍車而徒。","六二：賁其須。","九三：賁如濡如，永貞吉。","六四：賁如皤如，白馬翰如，匪寇婚媾。","六五：賁于丘園，束帛戋戋，吝，終吉。","上九：白賁，無咎。"],"xiang_da":"山下有火，賁﹔君子以明庶政，無敢折獄。","xiang_xiao":["舍車而徒，義弗乘也。","賁其須，與上興也。","永貞之吉，終莫之陵也。","六四，當位疑也。匪寇婚媾，終無尤也。","六五之吉，有喜也。","白賁無咎，上得志也。賁"],"composition":"艮上离下","pinyin":"Gèn shàng Lí xià"},{"seq":23,"name":"山地剝","hex":"䷖","gl":"NYYYYY","upn":"艮","upa":"土","lon":"坤","loa":"土","gs":"土","tg":"土","yg":"土","jw":"不利有攸往。","yuan":"剝有耗盡之象，有人家財萬貫，但出一子耗盡家財，所謂富不過三代，其因何在？有時見三老人，居老人院中，本是安養天年與世無爭，三人結拜兄弟後，長幼有序分列，此時如剝卦現，則其中一人必散盡三人之財務，終至引發自殺或仇殺事件，其因皆為財，世人但知為財殺，卻永遠無法深入瞭解，為何貪財如此？為何年至古稀，仍無法擺脫財利之惑？皆不知卦局之影響，乃能深入人心，使當事人蛻變而不自知，終致晚節不保，學者須戒之，一旦發現此贰拾贰局已成，必極盡人事破壞此局，免生大害，徒呼奈何？\n\n一、家有剝卦，主耗破家業，倫理喪失，傷風敗俗。\n\n二、性毒暗生，害人而人不知。\n\n三、婚事不成，同時生人即令流年紅鸞星動，亦無法成婚。\n\n四、科甲不順，考試必敗。\n\n五、身體災病多，折損陽壽。\n\n此局大凶，學者須能於事初即可判讀出，必可趨吉避凶，乃至大吉，功德無量，同道須知，助人於無形，受助人不自知，無法察覺到你的功勞，此其功德也，即陰德。今人捐募善款，為窮人洗衣、做飯、只是陽德，並非真功德。聖人治世，天下百姓，只知平安，無亂，無法感受到聖賢的功勞，庸才治世，天下大亂，其派人平亂後，人民見此，即認定其功勞很大，所以本書之出世，有警世教民之無知功效，同道共勉之。","tuan":"剝，剝也，柔變剛也。不利有攸往，小人長也。順而止之，觀象也。君子尚消息盈虛，天行也。","yao":["初六：剝牀以足，蔑貞凶。","六二：剝牀以辨，蔑貞凶。","六三：剝之，無咎。","六四：剝牀以膚，凶。","六五：貫魚，以宮人寵，無不利。","上九：碩果不食，君子得輿，小人剝廬。"],"xiang_da":"山附地上，剝﹔上以厚下，安宅。","xiang_xiao":["剝牀以足，以滅下也。","剝牀以辨，未有與也。","剝之無咎，失上下也。","剝牀以膚，切近災也。","以宮人寵，終無尤也。","君子得輿，民所載也。小人剝廬，終不可用也。"],"composition":"艮上坤下","pinyin":"Gèn shàng Kūn xià"},{"seq":24,"name":"地雷復","hex":"䷗","gl":"YYYYYN","upn":"坤","upa":"土","lon":"震","loa":"木","gs":"土","tg":"木","yg":"土","jw":"亨。出入無疾,朋來無咎。反覆其道,七日來復。利有攸往。","yuan":"吾人常見已婚之婦人，婚事不佳，獨立支撐家運，允文允武，屬木蘭型之人，必為復卦之局。\n\n一、有女身男人性格之徵。\n\n二、此卦局尤利發武官，即軍、警、法、外交等工作之人。\n\n三、代夫出征，絲毫不讓鬚眉。\n\n四、此局發官人，不發商人，尤以肖虎、兔人大吉，更旺。\n\n贰拾叁五、與夫之對應局為無妄卦，故夫妻必不和，其因乃生於妻志過丈夫，丈夫無法與其匹配，屋漏偏逢連夜雨，加上夫有官司是非纏身，所以對婚姻來說是加凶。","tuan":"復亨﹔剛反，動而以順行，是以出入無疾，朋來無咎。反復其道，七日來復，天行也。利有攸往，剛長也。復其見天地之心乎？","yao":["初九：不復遠，無只悔，元吉。","六二：休復，吉。","六三：頻復，厲無咎。","六四：中行獨復。","六五：敦復，無悔。","上六：迷復，凶，有災眚。用行師，終有大敗，以其國君，凶﹔至于十年，不克征。"],"xiang_da":"雷在地中，復﹔先王以至日閉關，商旅不行，后不省方。","xiang_xiao":["不遠之復，以修身也。","休復之吉，以下仁也。","頻復之厲，義無咎也。","中行獨復，以從道也。","敦復無悔，中以自考也。","迷復之凶，反君道也。復"],"composition":"坤上震下","pinyin":"Kūn shàng Zhèn xià"},{"seq":25,"name":"天雷無妄","hex":"䷘","gl":"NNNYYN","upn":"乾","upa":"金","lon":"震","loa":"木","gs":"金","tg":"木","yg":"金","jw":"元亨利貞。其匪正有眚,不利有攸往。","yuan":"此名無妄，猶無妄之災意，居此局之丈夫成此格，即令已離婚但有子女同住，只要象存在，其局不變。須注意此點。\n\n一、必須為從商較吉，但須防陰人暗客，有得財遇險之象，肖豬肖鼠人成格，主大財入，但皆有陰謀其中。\n\n二、如為公職人，則易流於利慾而挺身走險。\n\n三、求財招險事，住滿第二年，局再不動，必見之。\n\n四、性剛固執，不聽人言，故生小人，自亂陣腳。\n\n五、須防子災，故同時生人，有人無子，有人有子，但主夭折或叛逆，此其真因也。因強住長子位，致令長子無宮位，故生禍害。","tuan":"無妄，剛自外來，而為主於內。動而健，剛中而應，大亨以正，天之命也。其匪正有眚，不利有攸往。無妄之往，何之矣？天命不佑，行矣哉？","yao":["初九：無妄，往吉。","六二：不耕獲，不菑畬，則利有攸往。","六三：無妄之災，或系之牛，行人之得，邑人之災。","九四：可貞，無咎。","九五：無妄之疾，勿藥有喜。","上九：無妄，行有眚，無攸利。"],"xiang_da":"天下雷行，物與無妄﹔先王以茂對時，育萬物。","xiang_xiao":["無妄之往，得志也。","不耕獲，未富也。","行人得牛，邑人災也。","可貞無咎，固有之也。","無妄之藥，不可試也。","無妄之行，窮之災也。"],"composition":"乾上震下","pinyin":"Qián shàng Zhèn xià"},{"seq":26,"name":"山天大畜","hex":"䷙","gl":"NYYNNN","upn":"艮","upa":"土","lon":"乾","loa":"金","gs":"土","tg":"金","yg":"土","jw":"利貞,不家食吉,利涉大川。","yuan":"君不見有子為家不顧一切的工作，處處為家著想，甚至放棄婚事亦在所不惜，固然此象不一定在三子身上發生，但大畜卦必現於三子身上。\n\n一、代父之職守，負擔一家之生計。\n\n二、節儉至矣，絕不招待花錢買奢侈品，故頗有積蓄。\n\n贰拾肆三、有婚也短暫，必不足三月而破，比同時生人提前二年結婚。\n\n四、此局不利公職發展，必困於工作，堆積公文如山。\n\n人言有積乃大，誠不欺人也，許多人在婚前極盡節儉，往往婚後無法忍受妻子之奢侈浪費，終致離婚，故積的觀念產生在自己身上而不自覺，乃致婚後，硬要加諸於對方身上，終於破裂，吾人當於始時，即已察覺知曉，方不愧為習易之人。","tuan":"大畜，剛健篤實輝光，日新其德，剛上而尚賢。能止健，大正也。不家食吉，養賢也。利涉大川，應乎天也。","yao":["初九：有厲利已。","九二：輿說輻。","九三：良馬逐，利艱貞。曰閑輿衛，利有攸往。","六四：童豕之牿，元吉。","六五：豮豕之牙，吉。","上九：何天之衢，亨。"],"xiang_da":"天在山中，大畜﹔君子以多識前言往行，以畜其德。","xiang_xiao":["有厲利已，不犯災也。","輿說輻，中無尤也。","利有攸往，上合志也。","六四元吉，有喜也。","六五之吉，有慶也。","何天之衢，道大行也。"],"composition":"艮上乾下","pinyin":"Gèn shàng Qián xià"},{"seq":27,"name":"山雷頤","hex":"䷚","gl":"NYYYYN","upn":"艮","upa":"土","lon":"震","loa":"木","gs":"土","tg":"木","yg":"土","jw":"貞吉。觀頤,自求口實。","yuan":"頤有飲食養身之意，如何養人？如何養正？如何知養之正確與否？何時可養？這些零碎復雜的問題，如要一一解釋，不一定全部都能知道瞭解，八卦之入宅變局，就是取自然頤養之道，使萌生之始念，由己之所需要，人之性在其認為極需要之時，你提供所需方可真正受用，如果他本身不想要，即令是你的親人也無法改變他，只造成熱臉貼到冷屁股的結果。故吾人能參透易經，用陽宅方式，自然而然的大幅改變，其本人而不自知，相信是最有效的方法。此卦現則可見：一、少年得志，早來興發之象。\n\n二、身體健康平安，故同時生人如身體差，吾人可利用此局來化解，協助他吸取自然之精華，並能包含其情緒在內。\n\n三、婚姻當較同時生人提前五年，有早婚之傾向。\n\n贰拾伍四、如不經吾同道之人指點（屬易派象術宗），自然居此，有時甚至於為其他風水地理師所改，皆主同父異母之人，反觀之，為同父異母之人，卻居此局中，屢見不鮮。","tuan":"頤貞吉，養正則吉也。觀頤，觀其所養也﹔自求口實，觀其自養也。天地養萬物，聖人養賢，以及萬民﹔頤之時義大矣哉！","yao":["初九：舍爾靈龜，觀我朵頤，凶。","六二：顛頤，拂經，于丘頤，征凶。","六三：拂頤，貞凶，十年勿用，無攸利。","六四：顛頤吉，虎視眈眈，其欲逐逐，無咎。","六五：拂經，居貞吉，不可涉大川。","上九：由頤，厲吉，利涉大川。"],"xiang_da":"山下有雷，頤﹔君子以慎言語，節飲食。","xiang_xiao":["觀我朵頤，亦不足貴也。","六二征凶，行失類也。","十年勿用，道大悖也。","顛頤之吉，上施光也。","居貞之吉，順以從上也。","由頤厲吉，大有慶也。頤"],"composition":"艮上震下","pinyin":"Gèn shàng Zhèn xià"},{"seq":28,"name":"澤風大過","hex":"䷛","gl":"YNNNNY","upn":"兑","upa":"金","lon":"巽","loa":"木","gs":"金","tg":"木","yg":"金","jw":"棟橈,利有攸往,亨。","yuan":"大過之卦，於人事上分二解，一為犯下大過，二為立下大過於常人之功。地脈道比較偏狹，往往見到小妹最早嫁人，也嫁的最好，必為此卦。至於何時為大過，如何用大過之道，其進退之機，讀者可參看人間道部份，此不詳述。\n\n一、比同時生人早婚三年，且嫁夫有長十歲以上之狀況。\n\n二、身進豪門世家，享盡榮華富貴。\n\n三、性過剛，任意而為，婚前婚後都一樣。\n\n四、如婚之對象，年紀相近，必主凶，易破。","tuan":"大過，大者過也。棟橈，本末弱也。剛過而中，巽而說行，利有攸往，乃亨。大過之時義大矣哉！","yao":["初六：藉用白茅，無咎。","九二：枯楊生稊，老夫得其女妻，無不利。","九三：棟橈，凶。","九四：棟隆，吉﹔有它吝。","九五：枯楊生華，老婦得士夫，無咎無譽。","上六：過涉滅頂，凶，無咎。"],"xiang_da":"澤滅木，大過﹔君子以獨立不懼，稊世無悶。","xiang_xiao":["藉用白茅，柔在下也。","老夫女妻，過以相與也。","棟橈之凶，不可以有輔也。","棟隆之吉，不橈乎下也。","枯楊生華，何可久也。老婦士夫，亦可丑也。","過涉之凶，不可咎也。"],"composition":"兑上巽下","pinyin":"Duì shàng Xùn xià"},{"seq":29,"name":"坎為水","hex":"䷜","gl":"YNYYNY","upn":"坎","upa":"水","lon":"坎","loa":"水","gs":"水","tg":"水","yg":"水","jw":"習坎,有孚,維心亨,行有尚。","yuan":"本坎卦有險之象，位居正北，羅經上是子位，吾人常見四合院宅式，皆坐北向南，入宅後以中心點為準，其正北宮常設祖先牌位，神明所在或大廳所在，不居人，其因就是此位有險，故以神明續之，今人不知，無意之間此局現，則成次子格，可以發現：一、兒子喜歡冒險，諸如賭博、毒品等舉凡驚險刺激都有興趣。\n\n二、唯肖虎，肖牛人住吉。\n\n贰拾陆三、如此子肖鼠，又成此局，則暗中生害，為禍家人，母親必首當其衝。\n\n四、婚姻較同時生人，延後二年。\n\n五、此格之人，常犯官司，牢獄之災。\n\n解此局惟水火既濟卦可成，可令其脫胎換骨。","tuan":"習坎，重險也。水流而不盈，行險而不失其信。維心亨，乃以剛中也。行有尚，往有功也。天險不可升也，地險山川丘陵也，王公設險以守其國，坎之時用大矣哉！","yao":["初六：習坎，入于坎窞，凶。","九二：坎有險，求小得。","六三：來之坎坎，險且枕，入于坎窞，勿用。","六四：樽酒簋貳，用缶，納約自牖，終無咎。","九五：坎不盈，只既平，無咎。","上六：係用徽纆，置于叢棘，三歲不得，凶。"],"xiang_da":"水洊至，習坎﹔君子以常德行，習教事。","xiang_xiao":["習坎入坎，失道凶也。","求小得，未出中也。","來之坎坎，終無功也。","樽酒簋貳，剛柔際也。","坎不盈，中未大也。","上六失道，凶三歲也。"],"composition":"坎上坎下","pinyin":"Kǎn shàng Kǎn xià"},{"seq":30,"name":"離為火","hex":"䷝","gl":"NYNNYN","upn":"离","upa":"火","lon":"离","loa":"火","gs":"火","tg":"火","yg":"火","jw":"利貞,亨。畜牝牛,吉。","yuan":"此局常見，離卦本示人中虛為明，今人但以為自己很明，其實一直都沒進步，屢錯不改，茫然不知，皆肇因於不明，易經提出之中虛為明，就是隨時把自己變成空杯子，那才可以真明。家中有女，天生好手，明事理，知進退，必為此局，讀者須注意要知利用此局方是，不知運用，空言易經，吾所不恥。\n\n一、此女必心在遷移外地，不喜在本地。\n\n二、命格上如二十八歲婚，則宅局如此，必然不出二十八歲婚。\n\n三、天生明理而不懼。\n\n四、不守財祿，不重利之人。\n\n五、科甲高中，往往都是第一志願。","tuan":"離，麗也﹔日月麗乎天，百谷草木麗乎土，重明以麗乎正，乃化成天下。柔麗乎中正，故亨﹔是以畜牝牛吉也。","yao":["初九：履錯然，敬之無咎。","六二：黃離，元吉。","九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。","九四：突如其來如，焚如，死如，棄如。","六五：出涕沱若，戚嗟若，吉。","上九：王用出征，有嘉折首，獲其匪丑，無咎。"],"xiang_da":"明兩作離，大人以繼明照于四方。","xiang_xiao":["履錯之敬，以辟咎也。","黃離元吉，得中道也。","日昃之離，何可久也。","突如其來如，無所容也。","六五之吉，離王公也。","王用出征，以正邦也。離"],"composition":"离上离下","pinyin":"Lí shàng Lí xià"},{"seq":31,"name":"澤山鹹","hex":"䷞","gl":"YNNNYY","upn":"兑","upa":"金","lon":"艮","loa":"土","gs":"金","tg":"土","yg":"金","jw":"亨,利貞,取女吉。","yuan":"此卦局過去常見，今人不多，但讀者亦明瞭，其變化如後：一、婚成於媒妁之言，並非自由戀愛。\n\n贰拾柒二、婚事先成後破，凶。\n\n三、對象必為豪門世家，比同時生人早一年婚，逢單歲婚。\n\n四、財祿事業順利，工作野心大，但科甲不興。","tuan":"咸，感也。柔上而剛下，二氣感應以相與，止而說，男下女，是以亨利貞，取女吉也。天地感而萬物化生，聖人感人心而天下和平﹔觀其所感，而天地萬物之情可見矣！","yao":["初六：咸其拇。","六二：咸其腓，凶，居吉。","九三：咸其股，執其隨，往吝。","九四：貞吉悔亡，憧憧往來，朋從爾思。","九五：咸其脢，無悔。","上六：咸其輔，頰，舌。"],"xiang_da":"山上有澤，咸﹔君子以虛受人。","xiang_xiao":["咸其拇，志在外也。","雖凶，居吉，順不害也。","咸其股，亦不處也。志在隨人，所執下也。","貞吉悔亡，未感害也。憧憧往來，未光大也。","咸其脢，志末也。","咸其輔，頰，舌，滕口說也。"],"composition":"兑上艮下","pinyin":"Duì shàng Gèn xià"},{"seq":32,"name":"雷風恒","hex":"䷟","gl":"YYNNNY","upn":"震","upa":"木","lon":"巽","loa":"木","gs":"木","tg":"木","yg":"木","jw":"亨,無咎,利貞,利有攸往。","yuan":"今人最常見此局，化解局式，如雷地豫卦等都吉。\n\n一、易從宗教信仰，但不是正道之宗教。\n\n二、比同時生人晚婚一年。\n\n三、智慧被壓抑，常不知取捨，失去堅持。\n\n四、肖鼠人有吉，陰謀不生。\n\n五、官運不佳，商場不順，惟科甲旺，利教職自由業人。","tuan":"恆，久也。剛上而柔下，雷風相與，巽而動，剛柔皆應，恆。恆亨無咎，利貞﹔久於其道也，天地之道，恆久而不已也。利有攸往，終則有始也。日月得天，而能久照，四時變化，而能久成，聖人久於其道，而天下化成﹔觀其所恆，而天地萬物之情可見矣！","yao":["初六：浚恆，貞凶，無攸利。","九二：悔亡。","九三：不恆其德，或承之羞，貞吝。","九四：田無禽。","六五：恆其德，貞，婦人吉，夫子凶。","上六：振恆，凶。"],"xiang_da":"雷風，恆﹔君子以立不易方。","xiang_xiao":["浚恆之凶，始求深也。","九二悔亡，能久中也。","不恆其德，無所容也。","久非其位，安得禽也。","婦人貞吉，從一而終也。夫子制義，從婦凶也。","振恆在上，大無功也。恆"],"composition":"震上巽下","pinyin":"Zhèn shàng Xùn xià"},{"seq":33,"name":"天山遯","hex":"䷠","gl":"NNNNYY","upn":"乾","upa":"金","lon":"艮","loa":"土","gs":"金","tg":"土","yg":"金","jw":"亨,小利貞。","yuan":"吾人常見一家之主終日唉聲嘆氣，中年即無斡勁，且工作上付出勞力很多，卻往往功給他人，仕途原地踏步，毫無進展，必為此卦而所約束也。\n\n一、萌生退意，肇因於該升不升，有無力感二、夫妻感情退化，終致離婚。\n\n三、事事回歸原地，必須重新出發。\n\n四、身體亦有退化現象，中年即得老年病。","tuan":"遯亨，遯而亨也。剛當位而應，與時行也。小利貞，浸而長也。遯之時義大矣哉！","yao":["初六：遯尾，厲，勿用有攸往。","六二：執之用黃牛之革，莫之勝說。","九三：系遯，有疾厲，畜臣妾吉。","九四：好遯君子吉，小人否。","九五：嘉遯，貞吉。","上九：肥遯，無不利。"],"xiang_da":"天下有山，遯﹔君子以遠小人，不惡而嚴。","xiang_xiao":["遯尾之厲，不往何災也。","執用黃牛，固志也。","系遯之厲，有疾憊也。畜臣妾吉，不可大事也。","君子好遯，小人否也。","嘉遯貞吉，以正志也。","肥遯，無不利﹔無所疑也。"],"composition":"乾上艮下","pinyin":"Qián shàng Gèn xià"},{"seq":34,"name":"雷天大壯","hex":"䷡","gl":"YYNNNN","upn":"震","upa":"木","lon":"乾","loa":"金","gs":"木","tg":"金","yg":"木","jw":"利貞。","yuan":"此卦局也常見不鮮，吾人須知何局為大壯局，如何利用大壯贰拾捌局，何時可用大壯為最利。何時須離開此局。\n\n一、性剛為一家之主，有越居父位之象。\n\n二、家庭責任感重。\n\n三、不婚，與同時生人不同。\n\n四、如有婚，必為猴，兔，犬三肖屬之人，但常不足三月婚破。\n\n五、事業獨立自主，自由業人可為一方之主，聲名遠播。","tuan":"大壯，大者壯也。剛以動，故壯。大壯利貞﹔大者正也。正大而天地之情可見矣！","yao":["初九：壯于趾，征凶，有孚。","九二：貞吉。","九三：小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。","九四：貞吉悔亡，藩決不羸，壯于大輿之輹。","六五：喪羊于易，無悔。","上六：羝羊觸藩，不能退，不能遂，無攸利，艱則吉。"],"xiang_da":"雷在天上，大壯﹔君子以非禮勿履。","xiang_xiao":["壯于趾，其孚窮也。","九二貞吉，以中也。","小人用壯，君子罔也。","藩決不羸，尚往也。","喪羊于易，位不當也。","不能退，不能遂，不祥也。艱則吉，咎不長也。"],"composition":"震上乾下","pinyin":"Zhèn shàng Qián xià"},{"seq":35,"name":"火地晉","hex":"䷢","gl":"NYNYYY","upn":"离","upa":"火","lon":"坤","loa":"土","gs":"火","tg":"土","yg":"火","jw":"康侯用錫馬蕃庶,晝日三接。","yuan":"此局之現，讀者可以立判出。\n\n一、性柔有母愛之人。\n\n二、婚姻常晚，約四十歲以後。\n\n三、守財不花，性極節省之人。\n\n四、偏房之人，同時生人有婚為正房。\n\n五、婚嫁對象若肖雞，則大吉，但大年長多多。","tuan":"晉，進也。明出地上，順而麗乎大明，柔進而上行。是以康侯用錫馬蕃庶，晝日三接也。","yao":["初六：晉如，摧如，貞吉。罔孚，裕無咎。","六二：晉如，愁如，貞吉。受茲介福，于其王母。","六三：眾允，悔亡。","九四：晉如碩鼠，貞厲。","六五：悔亡，失得勿恤，往吉無不利。","上九：晉其角，維用伐邑，厲吉無咎，貞吝。"],"xiang_da":"明出地上，晉﹔君子以自昭明德。","xiang_xiao":["晉如，摧如﹔獨行正也。裕無咎﹔未受命也。","受之介福，以中正也。","眾允之，志上行也。","碩鼠貞厲，位不當也。","失得勿恤，往有慶也。","維用伐邑，道未光也。晉"],"composition":"离上坤下","pinyin":"Lí shàng Kūn xià"},{"seq":36,"name":"地火明夷","hex":"䷣","gl":"NYYNYN","upn":"艮","upa":"土","lon":"离","loa":"火","gs":"土","tg":"火","yg":"土","jw":"利艱貞。","yuan":"此卦很凶，宅局逢之，必主母先亡，且生前血光連年，希讀者遇之必力求其變局，功德無量，人不知其功，乃所謂陰德也。\n\n一、妻生隱疾不好告人。\n\n二、破財且諸事不順。\n\n三、易受小人言，招人暗害。\n\n贰拾玖四、一旦見血光，必終致凶。\n\n五、唯肖虎人，可平安渡過。","tuan":"明入地中，明夷。內文明而外柔順，以蒙大難，文王以之。利艱貞，晦其明也，內難而能正其志，箕子以之。","yao":["初九：明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。","六二：明夷，夷于左股，用拯馬壯，吉。","九三：明夷于南狩，得其大首，不可疾貞。","六四：入于左腹，獲明夷之心，出于門庭。","六五：箕子之明夷，利貞。","上六：不明晦，初登于天，后入于地。"],"xiang_da":"明入地中，明夷﹔君子以蒞眾，用晦而明。","xiang_xiao":["君子于行，義不食也。","六二之吉，順以則也。","南狩之志，乃大得也。","入于左腹，獲心意也。","箕子之貞，明不可息也。","初登于天，照四國也。后入于地，失則也。明夷"],"composition":"艮上离下","pinyin":"Gèn shàng Lí xià"},{"seq":37,"name":"風火家人","hex":"䷤","gl":"NNYNYN","upn":"巽","upa":"木","lon":"离","loa":"火","gs":"木","tg":"火","yg":"木","jw":"利女貞。","yuan":"今日常見之卦局，讀者可知如後：一、 從官職必無法升職。\n\n二、 科甲功名無慮。\n\n三、 婚延後五年與同時生人不同。\n\n四、 與家人相處和睦，且非常顧家。\n\n五、 多婦人病。","tuan":"家人，女正位乎內，男正位乎外，男女正，天地之大義也。家人有嚴君焉，父母之謂也。父父，子子，兄兄，弟弟，夫夫，婦婦，而家道正﹔正家而天下定矣。","yao":["初九：閑有家，悔亡。","六二：無攸遂，在中饋，貞吉。","九三：家人嗃嗃，悔厲吉﹔婦子嘻嘻，終吝。","六四：富家，大吉。","九五：王假有家，勿恤吉。","上九：有孚威如，終吉。"],"xiang_da":"風自火出，家人﹔君子以言有物，而行有恆。","xiang_xiao":["閑有家，志未變也。","六二之吉，順以巽也。","家人嗃嗃，未失也﹔婦子嘻嘻，失家節也。","富家大吉，順在位也。","王假有家，交相愛也。","威如之吉，反身之謂也。"],"composition":"巽上离下","pinyin":"Xùn shàng Lí xià"},{"seq":38,"name":"火澤睽","hex":"䷥","gl":"NYNYNN","upn":"离","upa":"火","lon":"兑","loa":"金","gs":"火","tg":"金","yg":"火","jw":"小事吉。","yuan":"我們常見有小女孩，背離家人，自顧自私，使父母深為苦惱，而無法改變，只有任其任性而為，終致一生皆凶，坎坷，實因自內生。\n\n一、性剛僻倔強，任性胡鬧，以致家無法容。\n\n二、肖牛肖鼠人見之，更凶。\n\n三、科甲不興。\n\n四、婚姻不成。\n\n五、招凶事，官司，災禍連連。\n\n六、有同性戀傾向。","tuan":"睽，火動而上，澤動而下﹔二女同居，其志不同行﹔說而麗乎明，柔進而上行，得中而應乎剛﹔是以小事吉。天地睽，而其事同也﹔男女睽，而其志通也﹔萬物睽，而其事類也﹔睽之時用大矣哉！","yao":["初九：悔亡，喪馬勿逐，自復﹔見惡人無咎。","九二：遇主于巷，無咎。","六三：見輿曳，其牛掣，其人天且劓，無初有終。","九四：睽孤，遇元夫，交孚，厲無咎。","六五：悔亡，厥宗噬膚，往何咎。","上九：睽孤，見豕負涂，載鬼一車，先張之弧，后說之弧，匪寇婚媾，往遇雨則吉。"],"xiang_da":"上火下澤，睽﹔君子以同而異。","xiang_xiao":["見惡人，以辟咎也。","遇主于巷，未失道也。","見輿曳，位不當也。無初有終，遇剛也。","交孚無咎，志行也。","厥宗噬膚，往有慶也。","遇雨之吉，群疑亡也。睽"],"composition":"离上兑下","pinyin":"Lí shàng Duì xià"},{"seq":39,"name":"水山蹇","hex":"䷦","gl":"YNYNYY","upn":"坎","upa":"水","lon":"艮","loa":"土","gs":"水","tg":"土","yg":"水","jw":"利西南,不利東北。利見大人,貞吉。","yuan":"此局利從武官之人，如軍人、員警、外交、司法人員等，也可以刻意佈出此局如果你想兒子從此類公職的話。\n\n一、求財亨通，且無功利之心。\n\n二、官調他鄉，與六親遠離。\n\n三、婚姻較同時生人延後七年。\n\n四、科甲吉，故考試資格必順心。\n\n五、獨自發展亦特立獨行也。","tuan":"蹇，難也，險在前也。見險而能止，知矣哉！蹇利西南，往得中也﹔不利東北，其道窮也。利見大人，往有功也。當位貞吉，以正邦也。蹇之時用大矣哉！","yao":["初六：往蹇，來譽。","六二：王臣蹇蹇，匪躬之故。","九三：往蹇來反。","六四：往蹇來連。","九五：大蹇朋來。","上六：往蹇來碩，吉﹔利見大人。"],"xiang_da":"山上有水，蹇﹔君子以反身修德。","xiang_xiao":["往蹇來譽，宜待也。","王臣蹇蹇，終無尤也。","往蹇來反，內喜之也。","往蹇來連，當位實也。","大蹇朋來，以中節也。","往蹇來碩，志在內也。利見大人，以從貴也。蹇"],"composition":"坎上艮下","pinyin":"Kǎn shàng Gèn xià"},{"seq":40,"name":"雷水解","hex":"䷧","gl":"YYNYNY","upn":"震","upa":"木","lon":"坎","loa":"水","gs":"木","tg":"水","yg":"木","jw":"利西南,無所往,其來復吉,有攸往夙吉。","yuan":"此卦局常見，也相當特殊：一、為性剛武勇之人。\n\n二、總是官司是非不斷。\n\n三、無婚。\n\n四、肖兔人，劉姓人，柳姓人，主凶。\n\n五、出家為唯一可解之人事手段。","tuan":"解，險以動，動而免乎險，解。解利西南，往得眾也。其來復吉，乃得中也。有攸往夙吉，往有功也。天地解，而雷雨作，雷雨作，而百果草木皆甲坼，解之時義大矣哉！","yao":["初六：無咎。","九二：田獲三狐，得黃矢，貞吉。","六三：負且乘，致寇至，貞吝。","九四：解而拇，朋至斯孚。","六五：君子維有解，吉﹔有孚于小人。","上六：公用射隼，于高墉之上，獲之，無不利。"],"xiang_da":"雷雨作，解﹔君子以赦過宥罪。","xiang_xiao":["剛柔之際，義無咎也。","九二貞吉，得中道也。","負且乘，亦可丑也，自我致戎，又誰咎也。","解而拇，未當位也。","君子有解，小人退也。","公用射隼，以解悖也。解"],"composition":"震上坎下","pinyin":"Zhèn shàng Kǎn xià"},{"seq":41,"name":"山澤損","hex":"䷨","gl":"NYYYNN","upn":"艮","upa":"土","lon":"兑","loa":"金","gs":"土","tg":"金","yg":"土","jw":"有孚,元吉,無咎,可貞,利有攸往。曷之用?二簋可用享。","yuan":"損局在陽宅上造成兒子問題多多，父母總是煩心擔憂。\n\n一、與同時生人，婚事延後一年方成，對方同一人。\n\n二、官運不通，所求不成。\n\n三、性喜求樂，不求進步，須經二次大災，方能悟。\n\n四、對家庭態度，只會花錢，不會賺錢，無所事事。","tuan":"損，損下益上，其道上行。損而有孚，元吉，無咎，可貞，利有攸往。曷之用？二簋可用享﹔二簋應有時。損剛益柔有時，損益盈虛，與時偕行。","yao":["初九：已事遄往，無咎，酌損之。","九二：利貞，征凶，弗損益之。","六三：三人行，則損一人﹔一人行，則得其友。","六四：損其疾，使遄有喜，無咎。","六五：或益之，十朋之龜弗克違，元吉。","上九：弗損益之，無咎，貞吉，利有攸往，得臣無家。"],"xiang_da":"山下有澤，損﹔君子以懲忿窒欲。","xiang_xiao":["已事遄往，尚合志也。","九二利貞，中以為志也。","一人行，三則疑也。","損其疾，亦可喜也。","六五元吉，自上佑也。","弗損益之，大得志也。損"],"composition":"艮上兑下","pinyin":"Gèn shàng Duì xià"},{"seq":42,"name":"風雷益","hex":"䷩","gl":"NNYYYN","upn":"巽","upa":"木","lon":"震","loa":"木","gs":"木","tg":"木","yg":"木","jw":"利有攸往,利涉大川。","yuan":"一、長女之婚事不成，或成後又破。\n\n二、財祿足，有祖業，工作則又過於男性。\n\n三、女身男性，貴人為男人，小人為女子。\n\n四、從官運則吉，切不可貪祿，主兇。","tuan":"益，損上益下，民說無疆，自上下下，其道大光。利有攸往，中正有慶。利涉大川，木道乃行。益動而巽，日進無疆。天施地生，其益無方。凡益之道，與時偕行。","yao":["初九：利用為大作，元吉，無咎。","六二：或益之，十朋之龜弗克違，永貞吉。王用享于帝，吉。","六三：益之用凶事，無咎。有孚中行，告公用圭。","六四：中行，告公從。利用為依遷國。","九五：有孚惠心，勿問元吉。有孚惠我德。","上九：莫益之，或擊之，立心勿恆，凶。"],"xiang_da":"風雷，益﹔君子以見善則遷，有過則改。","xiang_xiao":["元吉無咎，下不厚事也。","或益之，自外來也。","益用凶事，固有之也。","告公從，以益志也。","有孚惠心，勿問之矣。惠我德，大得志也。","莫益之，偏辭也。或擊之，自外來也。益"],"composition":"巽上震下","pinyin":"Xùn shàng Zhèn xià"},{"seq":43,"name":"澤天夬","hex":"䷪","gl":"YNNNNN","upn":"兑","upa":"金","lon":"乾","loa":"金","gs":"金","tg":"金","yg":"金","jw":"揚於王庭,孚號有厲。告自邑,不利即戎,利有攸往。","yuan":"一、婚事延宕不成。\n\n二、性剛從武，性柔從宗教，吾人可從八字中看出。\n\n三、事業先主兇後吉，主自行發展。\n\n四、科甲不興。\n\n五、身體健康差，不長壽，三十歲前有兇險。","tuan":"夬，決也，剛決柔也。健而說，決而和，揚于王庭，柔乘五剛也。孚號有厲，其危乃光也。告自邑，不利即戎，所尚乃窮也。利有攸往，剛長乃終也。","yao":["初九：壯于前趾，往不勝為吝。","九二：惕號，莫夜有戎，勿恤。","九三：壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，無咎。","九四：臀無膚，其行次且。牽羊悔亡，聞言不信。","九五：莧陸夬夬，中行無咎。","上六：無號，終有凶。"],"xiang_da":"澤上于天，夬﹔君子以施祿及下，居德則忌。","xiang_xiao":["不勝而往，咎也。","莫夜有戎，得中道也。","君子夬夬，終無咎也。","其行次且，位不當也。聞言不信，聰不明也。","中行無咎，中未光也。","無號之凶，終不可長也。"],"composition":"兑上乾下","pinyin":"Duì shàng Qián xià"},{"seq":44,"name":"天風姤","hex":"䷫","gl":"NNNNNY","upn":"乾","upa":"金","lon":"巽","loa":"木","gs":"金","tg":"木","yg":"金","jw":"女壯,勿用取女。","yuan":"吾人常見丈夫在外風流多事，桃花運不斷，就是此局生成。\n\n一、 商人財祿豐盛，只旺六年，須注意假像。\n\n二、 官司受牽連，同時生人可能沒事。\n\n三、 外有妾及多位女友。\n\n四、 夫妻失和，如命中屬二婚命，則必破。\n\n五、 官家人亦吉前六年，第七年以後必兇。\n\n叁拾贰","tuan":"姤，遇也，柔遇剛也。勿用取女，不可與長也。天地相遇，品物咸章也。剛遇中正，天下大行也。姤之時義大矣哉！","yao":["初六：系于金柅，貞吉，有攸往，見凶，羸豕踟躅。","九二：包有魚，無咎，不利賓。","九三：臀無膚，其行次且，厲，無大咎。","九四：包無魚，起凶。","九五：以杞包瓜，含章，有隕自天。","上九：姤其角，吝，無咎。"],"xiang_da":"天下有風，姤﹔后以施命誥四方。","xiang_xiao":["系于金柅，柔道牽也。","包有魚，義不及賓也。","其行次且，行未牽也。","無魚之凶，遠民也。","九五含章，中正也。有隕自天，志不舍命也。","姤其角，上窮吝也。"],"composition":"乾上巽下","pinyin":"Qián shàng Xùn xià"},{"seq":45,"name":"澤地萃","hex":"䷬","gl":"YNNYYY","upn":"兑","upa":"金","lon":"坤","loa":"土","gs":"金","tg":"土","yg":"金","jw":"亨,王假有廟,利見大人,亨,利貞。用大牲吉,利有攸往。","yuan":"較不多見，但亦有之。\n\n一、女兒不想成婚，對異性沒興趣。\n\n二、終日進德修業。\n\n三、退居家內，代母行職，為良母型之人。\n\n四、如從事餐飲業則大利，為唯一帶喜之路。","tuan":"萃，聚也﹔順以說，剛中而應，故聚也。王假有廟，致孝享也。利見大人亨，聚以正也。用大牲吉，利有攸往，順天命也。觀其所聚，而天地萬物之情可見矣。","yao":["初六：有孚不終，乃亂乃萃，若號一握為笑，勿恤，往無咎。","六二：引吉，無咎，孚乃利用禴。","六三：萃如，嗟如，無攸利，往無咎，小吝。","九四：大吉，無咎。","九五：萃有位，無咎。匪孚，元永貞，悔亡。","上六：賫咨涕洟，無咎。"],"xiang_da":"澤上於地，萃﹔君子以除戎器，戒不虞。","xiang_xiao":["乃亂乃萃，其志亂也。","引吉無咎，中未變也。","往無咎，上巽也。","大吉無咎，位不當也。","萃有位，志未光也。","賫咨涕洟，未安上也。"],"composition":"兑上坤下","pinyin":"Duì shàng Kūn xià"},{"seq":46,"name":"地風升","hex":"䷭","gl":"YYYNNY","upn":"坤","upa":"土","lon":"巽","loa":"木","gs":"土","tg":"木","yg":"土","jw":"元亨,用見大人,勿恤,南征吉。","yuan":"其為姤卦之對應卦，在地脈道之屢見不鮮，學者當已嫻熟於卦局之變化，立可知曉。\n\n一、官職大利，平步青雲。\n\n二、事業財祿豐盛。\n\n三、能承繼祖業，更新門面。\n\n四、夫妻有競爭，不和之象。\n\n五、此局不變，婚姻進入第七年必有兇，同時生人不一定會發生，故陽宅影響一人至大，而人們卻茫然不知。","tuan":"柔以時升，巽而順，剛中而應，是以大亨。用見大人，勿恤﹔有慶也。南征吉，志行也。","yao":["初六：允升，大吉。","九二：孚乃利用禴，無咎。","九三：升虛邑。","六四：王用亨于岐山，吉無咎。","六五：貞吉，升階。","上六：冥升，利于不息之貞。"],"xiang_da":"地中生木，升﹔君子以順德，積小以高大。","xiang_xiao":["允升大吉，上合志也。","九二之孚，有喜也。","升虛邑，無所疑也。","王用亨于岐山，順事也。","貞吉升階，大得志也。","冥升在上，消不富也。"],"composition":"坤上巽下","pinyin":"Kūn shàng Xùn xià"},{"seq":47,"name":"澤水困","hex":"䷮","gl":"YNNYNY","upn":"兑","upa":"金","lon":"坎","loa":"水","gs":"金","tg":"水","yg":"金","jw":"亨,貞,大人吉,無咎,有言不信。","yuan":"困之於人大矣，吾道人士能為眾生解開此局，亦無量功德也。\n\n一、體弱多病，限不過三十歲。\n\n二、性剛烈，獨行獨斷。\n\n三、婚事不成，多有阻滯。\n\n四、財祿不守，只有一線生機，故從商必兇。\n\n解之唯大過可也。","tuan":"困，剛掩也。險以說，困而不失其所，亨﹔其唯君子乎？貞大人吉，以剛中也。有言不信，尚口乃窮也。","yao":["初六：臀困于株木，入于幽谷，三歲不見。","九二：困于酒食，朱紱方來，利用亨祀，征凶，無咎。","六三：困于石，據于蒺藜，入于其宮，不見其妻，凶。","九四：來徐徐，困于金車，吝，有終。","九五：劓刖，困于赤紱，乃徐有說，利用祭祀。","上六：困于葛藟，于卼臲，曰動悔。有悔，征吉。"],"xiang_da":"澤無水，困﹔君子以致命遂志。","xiang_xiao":["入于幽谷，幽不明也。","困于酒食，中有慶也。","據于蒺藜，乘剛也。入于其宮，不見其妻，不祥也。","來徐徐，志在下也。雖不當位，有與也。","劓刖，志未得也。乃徐有說，以中直也。利用祭祀，受福也。","困于葛藟，未當也。動悔，有悔吉，行也。"],"composition":"兑上坎下","pinyin":"Duì shàng Kǎn xià"},{"seq":48,"name":"水風井","hex":"䷯","gl":"YNYNNY","upn":"坎","upa":"水","lon":"巽","loa":"木","gs":"水","tg":"木","yg":"水","jw":"改邑不改井,無喪無得,往來井井。汔至亦未繘井,羸其瓶,兇。","yuan":"一、婚事娶二婚妻，且妻長。\n\n二、心志不堅，受外在誘惑，無法自拔。\n\n三、從商吉，有祖業更吉。\n\n四、從官招陷，是非不斷，升遷受阻。","tuan":"巽乎水而上水，井﹔井養而不窮也。改邑不改井，乃以剛中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也。","yao":["初六：井泥不食，舊井無禽。","九二：井谷射鮒，瓮敝漏。","九三：井渫不食，為我民惻，可用汲，王明，并受其福。","六四：井甃，無咎。","九五：井冽，寒泉食。","上六：井收勿幕，有孚無吉。"],"xiang_da":"木上有水，井﹔君子以勞民勸相。","xiang_xiao":["井泥不食，下也。舊井無禽，時舍也。","井谷射鮒，無與也。","井渫不食，行惻也。求王明，受福也。","井甃無咎，修井也。","寒泉之食，中正也。","元吉在上，大成也。"],"composition":"坎上巽下","pinyin":"Kǎn shàng Xùn xià"},{"seq":49,"name":"澤火革","hex":"䷰","gl":"YNNNYN","upn":"兑","upa":"金","lon":"离","loa":"火","gs":"金","tg":"火","yg":"金","jw":"己日乃孚,元亨利貞,悔亡。","yuan":"一、 此女天生剛勇，且明事理。\n\n二、 感情困擾多。\n\n三、 婚姻比同時生人早二年，且比姊早婚。","tuan":"革，水火相息，二女同居，其志不相得，曰革。己日乃孚﹔革而信也。文明以說，大亨以正，革而當，其悔乃亡。天地革而四時成，湯武革命，順乎天而應乎人，革之時義大矣哉！","yao":["初九：鞏用黃牛之革。","六二：己日乃革之，征吉，無咎。","九三：征凶，貞厲，革言三就，有孚。","九四：悔亡，有孚改命，吉。","九五：大人虎變，未占有孚。","上六：君子豹變，小人革面，征凶，居貞吉。"],"xiang_da":"澤中有火，革﹔君子以治歷明時。","xiang_xiao":["鞏用黃牛，不可以有為也。","己日革之，行有嘉也。","革言三就，又何之矣。","改命之吉，信志也。","大人虎變，其文炳也。","君子豹變，其文蔚也。小人革面，順以從君也。革"],"composition":"兑上离下","pinyin":"Duì shàng Lí xià"},{"seq":50,"name":"火風鼎","hex":"䷱","gl":"NYNNNY","upn":"离","upa":"火","lon":"巽","loa":"木","gs":"火","tg":"木","yg":"火","jw":"元吉,亨。","yuan":"此局最利未婚小姐，我常利用此局助人無數。\n\n一、 其必嫁貴夫。\n\n二、 果決剛斷，不易受惑。\n\n三、 婚比姊早婚，且冬天方成。\n\n四、 官運亨通，財不利。\n\n五、 鼠生人凶，不吉。\n\n六、 科甲吉，考試順利。","tuan":"鼎，象也。以木巽火，亨飪也。聖人亨以享上帝，而大亨以養聖賢。巽而耳目聰明，柔進而上行，得中而應乎剛，是以元亨。","yao":["初六：鼎顛趾，利出否，得妾以其子，無咎。","九二：鼎有實，我仇有疾，不我能即，吉。","九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。","九四：鼎折足，覆公餗，其形渥，凶。","六五：鼎黃耳金鉉，利貞。","上九：鼎玉鉉，大吉，無不利。"],"xiang_da":"木上有火，鼎﹔君子以正位凝命。","xiang_xiao":["鼎顛趾，未悖也。利出否，以從貴也。","鼎有實，慎所之也。我仇有疾，終無尤也。","鼎耳革，失其義也。","覆公餗，信如何也。","鼎黃耳，中以為實也。","玉鉉在上，剛柔節也。"],"composition":"离上巽下","pinyin":"Lí shàng Xùn xià"},{"seq":51,"name":"震為雷","hex":"䷲","gl":"YYNYYN","upn":"震","upa":"木","lon":"震","loa":"木","gs":"木","tg":"木","yg":"木","jw":"亨。震來虩虩,笑言啞啞。震驚百里,不喪匕鬯。","yuan":"生局之中，此局很特殊，未經吾派之人改，自然居此局中人，其必天生好手，在家為貴子無疑。\n\n一、 有承繼祖業，發揚光大之實力。\n\n二、 科甲興旺，名列前茅。\n\n三、 官運通順，只限未婚前。\n\n四、 從商亦吉，但須為負責人。\n\n五、 婚姻按命中走，紅鸞星動之年，即成婚之年。\n\n六、 須注意此局只現在婚前，婚後必不見。惟天卦可繼續其運勢。","tuan":"震，亨。震來虩虩，恐致福也。笑言啞啞，后有則也。震驚百里，驚遠而懼邇也。出可以守宗廟社稷，以為祭主也。","yao":["初九：震來虩虩，后笑言啞啞，吉。","六二：震來厲，億喪貝，躋于九陵，勿逐，七日得。","六三：震蘇蘇，震行無眚。","九四：震遂泥。","六五：震往來厲，億無喪，有事。","上六：震索索，視矍矍，征凶。震不于其躬，于其鄰，無咎。婚媾有言。"],"xiang_da":"洊雷，震﹔君子以恐懼修身。","xiang_xiao":["震來虩虩，恐致福也。笑言啞啞，后有則也。","震來厲，乘剛也。","震蘇蘇，位不當也。","震遂泥，未光也。","震往來厲，危行也。其事在中，大無喪也。","震索索，未得中也。雖凶無咎，畏鄰戒也。"],"composition":"震上震下","pinyin":"Zhèn shàng Zhèn xià"},{"seq":52,"name":"艮為山","hex":"䷳","gl":"NYYNYY","upn":"艮","upa":"土","lon":"艮","loa":"土","gs":"土","tg":"土","yg":"土","jw":"艮其背,不獲其身,行其庭,不見其人,無咎。","yuan":"一、 科甲順利，必中理想之學校。\n\n二、 健康平安，為孝子。\n\n三、 婚姻順利，進入八字中紅鸞星之年必婚。\n\n四、 公職大利。\n\n五、 知進退，為天生受人喜歡之人。","tuan":"艮，止也。時止則止，時行則行，動靜不失其時，其道光明。艮其止，止其所也。上下敵應，不相與也。是以不獲其身，行其庭不見其人，無咎也。","yao":["初六：艮其趾，無咎，利永貞。","六二：艮其腓，不拯其隨，其心不快。","九三：艮其限，列其夤，厲薰心。","六四：艮其身，無咎。","六五：艮其輔，言有序，悔亡。","上九：敦艮，吉。"],"xiang_da":"兼山，艮﹔君子以思不出其位。","xiang_xiao":["艮其趾，未失正也。","不拯其隨，未退聽也。","艮其限，危薰心也。","艮其身，止諸躬也。","艮其輔，以中正也。","敦艮之吉，以厚終也。艮"],"composition":"艮上艮下","pinyin":"Gèn shàng Gèn xià"},{"seq":53,"name":"風山漸","hex":"䷴","gl":"NNYNYY","upn":"巽","upa":"木","lon":"艮","loa":"土","gs":"木","tg":"土","yg":"木","jw":"女歸吉,利貞。","yuan":"一、 科甲不順，缺臨門一腳。\n\n二、 工作心念不定，常思變動。\n\n三、 身體平安，災少。\n\n四、 對婚姻不采主動，婚事難成。\n\n五、 出任公、教職大利。\n\n此局變化多，隨時成之故學者須注意。","tuan":"漸之進也，女歸吉也。進得位，往有功也。進以正，可以正邦也。其位剛，得中也。止而巽，動不窮也。","yao":["初六：鴻漸于干，小子厲，有言，無咎。","六二：鴻漸于磐，飲食衎衎，吉。","九三：鴻漸于陸，夫征不復，婦孕不育，凶﹔利御寇。","六四：鴻漸于木，或得其桷，無咎。","九五：鴻漸于陵，婦三歲不孕，終莫之勝，吉。","上九：鴻漸于逵，其羽可用為儀，吉。"],"xiang_da":"山上有木，漸﹔君子以居賢德，善俗。","xiang_xiao":["小子之厲，義無咎也。","飲食衎衎，不素飽也。","夫征不復，離群丑也。婦孕不育，失其道也。利用御寇，順相保也。","或得其桷，順以巽也。","終莫之勝，吉﹔得所愿也。","其羽可用為儀，吉﹔不可亂也。"],"composition":"巽上艮下","pinyin":"Xùn shàng Gèn xià"},{"seq":54,"name":"雷澤歸妹","hex":"䷵","gl":"YYNYNN","upn":"震","upa":"木","lon":"兑","loa":"金","gs":"木","tg":"金","yg":"木","jw":"徵兇,無攸利。","yuan":"現代人為愛滋病所苦，目前醫學界雖仍無法認定其必由同性戀傳染來的，我也不否定其是否正確，但可以肯定的是，其行為必不為父母所能接受的，此局無人發現，自古以來因道德束縛力很強，家族同住，故較不易發生，史有明載其斷袖之癖即言同性戀，但不似今日之普遍，世界各國皆為此苦惱不已，其實易經中早已明確指出其從何而來？為何有人如此，有人不苟同？如何化解？男同性戀出歸妹卦，女同性戀出益卦、旅卦、漸卦、鼎卦等變化較多，其化解只須正位即可改變。\n\n一、 男同性戀，父母煩憂，終致離家出走。\n\n二、 委曲以求祿。\n\n三、 無婚。\n\n四、 諸事不順，但多才多藝，走藝術路線佳。","tuan":"歸妹，天地之大義也。天地不交，而萬物不興，歸妹人之終始也。說以動，所歸妹也。征凶，位不當也。無攸利，柔乘剛也。","yao":["初九：歸妹以娣，跛能履，征吉。","九二：眇能視，利幽人之貞。","六三：歸妹以須，反歸以娣。","九四：歸妹愆期，遲歸有時。","六五：帝乙歸妹，其君之袂，不如其娣之袂良，月几望，吉。","上六：女承筐無實，士刲羊無血，無攸利。"],"xiang_da":"澤上有雷，歸妹﹔君子以永終知敝。","xiang_xiao":["歸妹以娣，以恆也。跛能履吉，相承也。","利幽人之貞，未變常也。","歸妹以須，未當也。","愆期之志，有待而行也。","帝乙歸妹，不如其娣之袂良也。其位在中，以貴行也。","上六無實，承虛筐也。"],"composition":"震上兑下","pinyin":"Zhèn shàng Duì xià"},{"seq":55,"name":"雷火豐","hex":"䷶","gl":"YYNNYN","upn":"震","upa":"木","lon":"离","loa":"火","gs":"木","tg":"火","yg":"木","jw":"亨。王假之,勿憂,宜日中。","yuan":"此卦常出現在兒子身上一、 未經本派之人指點，乃自然居此局中之人，其與同時生人不同，婚事必先成後破。\n\n叁拾陆二、 科甲考試順利。\n\n三、 性剛且堅，易與人爭，必為感情困擾。\n\n四、 從商必破財。\n\n五、 從官職吉。","tuan":"丰，大也。明以動，故丰。王假之，尚大也。勿憂宜日中，宜照天下也。日中則昃，月盈則食，天地盈虛，與時消息，而況人於人乎？況於鬼神乎？","yao":["初九：遇其配主，雖旬無咎，往有尚。","六二：丰其蔀，日中見斗，往得疑疾，有孚發若，吉。","九三：丰其沛，日中見昧，折其右肱，無咎。","九四：丰其蔀，日中見斗，遇其夷主，吉。","六五：來章，有慶譽，吉。","上六：丰其屋，蔀其家，窺其戶，闃其無人，三歲不見，凶。"],"xiang_da":"雷電皆至，丰﹔君子以折獄致刑。","xiang_xiao":["雖旬無咎，過旬災也。","有孚發若，信以發志也。","丰其沛，不可大事也。折其右肱，終不可用也。","丰其蔀，位不當也。日中見斗，幽不明也。遇其夷主，吉﹔行也。","六五之吉，有慶也。","丰其屋，天際翔也。窺其戶，闃其無人，自藏也。"],"composition":"震上离下","pinyin":"Zhèn shàng Lí xià"},{"seq":56,"name":"火山旅","hex":"䷷","gl":"NYNNYY","upn":"离","upa":"火","lon":"艮","loa":"土","gs":"火","tg":"土","yg":"火","jw":"小亨,旅貞吉。","yuan":"此局特殊，學者須識。\n\n一、 科甲興旺二、 女身男態三、 婚事不成，須逢肖羊、肖猴或于未、申之年方有成。\n\n四、 城府較深，終自取咎。","tuan":"旅，小亨，柔得中乎外，而順乎剛，止而麗乎明，是以小亨，旅貞吉也。旅之時義大矣哉！","yao":["初六：旅瑣瑣，斯其所取災。","六二：旅即次，懷其資，得童仆貞。","九三：旅焚其次，喪其童仆，貞厲。","九四：旅于處，得其資斧，我心不快。","六五：射雉一矢亡，終以譽命。","上九：鳥焚其巢，旅人先笑后號啕。喪牛于易，凶。"],"xiang_da":"山上有火，旅﹔君子以明慎用刑，而不留獄。","xiang_xiao":["旅瑣瑣，志窮災也。","得童仆貞，終無尤也。","旅焚其次，亦以傷矣。以旅與下，其義喪也。","旅于處，未得位也。得其資斧，心未快也。","終以譽命，上逮也。","以旅在上，其義焚也。喪牛于易，終莫之聞也。旅"],"composition":"离上艮下","pinyin":"Lí shàng Gèn xià"},{"seq":57,"name":"巽為風","hex":"䷸","gl":"NNYNNY","upn":"巽","upa":"木","lon":"巽","loa":"木","gs":"木","tg":"木","yg":"木","jw":"小亨,利有攸往,利見大人。","yuan":"此局大利未婚女，吾每逢有未婚小姐來求教，都不厭其煩的希望他能住在此局中，必主婚姻幸福。\n\n一、 科甲興旺，考試必中。\n\n二、 逢凶化吉，災事不興。\n\n三、 婚姻必能嫁好夫婿，逢紅鸞即動。\n\n四、 性情穩定，處憂不懼。\n\n五、 健康平安之人。","tuan":"重巽以申命，剛巽乎中正而志行。柔皆順乎剛，是以小亨，利有攸往，利見大人。","yao":["初六：進退，利武人之貞。","九二：巽在牀下，用史巫紛若，吉無咎。","九三：頻巽，吝。","六四：悔亡，田獲三品。","九五：貞吉悔亡，無不利。無初有終，先庚三日，后庚三日，吉。","上九：巽在牀下，喪其資斧，貞凶。"],"xiang_da":"隨風，巽﹔君子以申命行事。","xiang_xiao":["進退，志疑也。利武人之貞，志治也。","紛若之吉，得中也。","頻巽之吝，志窮也。","田獲三品，有功也。","九五之吉，位正中也。","巽在牀下，上窮也。喪其資斧，正乎凶也。"],"composition":"巽上巽下","pinyin":"Xùn shàng Xùn xià"},{"seq":58,"name":"兌為澤","hex":"䷹","gl":"YNNYNN","upn":"兑","upa":"金","lon":"兑","loa":"金","gs":"金","tg":"金","yg":"金","jw":"亨,利貞。","yuan":"一、 求婚事必不成，感情複雜又專一不二，如遇虎狼之人必傷害甚大。\n\n二、 有待婚中，夫凶之象，婚比同時生人，延後三年。\n\n三、 科甲順暢，多才藝之女。\n\n四、 公職順遂，但從商必主不利。\n\n五、 體健無災，母蔭重，有無父之虞。","tuan":"兌，說也。剛中而柔外，說以利貞，是以順乎天，而應乎人。說以先民，民忘其勞﹔說以犯難，民忘其死﹔說之大，民勸矣哉！","yao":["初九：和兌，吉。","九二：孚兌，吉，悔亡。","六三：來兌，凶。","九四：商兌，未寧，介疾有喜。","九五：孚于剝，有厲。","上六：引兌。"],"xiang_da":"麗澤，兌﹔君子以朋友講習。","xiang_xiao":["和兌之吉，行未疑也。","孚兌之吉，信志也。","來兌之凶，位不當也。","九四之喜，有慶也。","孚于剝，位正當也。","上六引兌，未光也。兌"],"composition":"兑上兑下","pinyin":"Duì shàng Duì xià"},{"seq":59,"name":"風水渙","hex":"䷺","gl":"NNYYNY","upn":"巽","upa":"木","lon":"坎","loa":"水","gs":"木","tg":"水","yg":"木","jw":"亨。王假有廟,利涉大川,利貞。","yuan":"渙局亦常見之，吾人利用風卦可立解。\n\n一、心在宗教，不想結婚，但易入邪道。\n\n二、心中有鬼，諸事不成。\n\n三、禍事連連，官非牢獄災難免。\n\n四、出家化解災厄，母親終日擔憂。","tuan":"渙，亨。剛來而不窮，柔得位乎外而上同。王假有廟，王乃在中也。利涉大川，乘木有功也。","yao":["初六：用拯馬壯，吉。","九二：渙奔其機，悔亡。","六三：渙其躬，無悔。","六四：渙其群，元吉。渙有丘，匪夷所思。","九五：渙汗其大號，渙王居，無咎。","上九：渙其血，去逖出，無咎。"],"xiang_da":"風行水上，渙﹔先王以享于帝立廟。","xiang_xiao":["初六之吉，順也。","渙奔其機，得愿也。","渙其躬，志在外也。","渙其群，元吉﹔光大也。","王居無咎，正位也。","渙其血，遠害也。渙"],"composition":"巽上坎下","pinyin":"Xùn shàng Kǎn xià"},{"seq":60,"name":"水澤節","hex":"䷻","gl":"YNYYNN","upn":"坎","upa":"水","lon":"兑","loa":"金","gs":"水","tg":"金","yg":"水","jw":"亨,苦節不可貞。","yuan":"一、本人肖雞，則必大貴。\n\n二、本人肖犬，則以小做大，招自陷。\n\n三、財無積餘，行險招兇。\n\n婚事不成，犬人遇雞則成，妻長一歲，與同時生人不同，且妻主大貴，助夫渡厄。","tuan":"節，亨，剛柔分，而剛得中。苦節不可貞，其道窮也。說以行險，當位以節，中正以通。天地節而四時成，節以制度，不傷財，不害民。","yao":["初九：不出戶庭，無咎。","九二：不出門庭，凶。","六三：不節若，則嗟若，無咎。","六四：安節，亨。","九五：甘節，吉﹔往有尚。","上六：苦節，貞凶，悔亡。"],"xiang_da":"澤上有水，節﹔君子以制數度，議德行。","xiang_xiao":["不出戶庭，知通塞也。","不出門庭，失時極也。","不節之嗟，又誰咎也。","安節之亨，承上道也。","甘節之吉，居位中也。","苦節貞凶，其道窮也。節"],"composition":"坎上兑下","pinyin":"Kǎn shàng Duì xià"},{"seq":61,"name":"風澤中孚","hex":"䷼","gl":"YNNNNY","upn":"兑","upa":"金","lon":"巽","loa":"木","gs":"金","tg":"木","yg":"金","jw":"豚魚吉,利涉大川,利貞。","yuan":"有女每試必為狀元，即生此局之人一、科甲狀元，每考必中。\n\n二、武職大利，女中豪傑，今見有女司法官如此。\n\n三、雙喜同臨，常在婚姻中伴之而來金榜登科。\n\n四、喜事初不成，家中不同意，後成。但與同時生人延後三年。","tuan":"中孚，柔在內而剛得中。說而巽，孚，乃化邦也。豚魚吉，信及豚魚也。利涉大川，乘木舟虛也。中孚以利貞，乃應乎天也。","yao":["初九：虞吉，有他不燕。","九二：鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。","六三：得敵，或鼓或罷，或泣或歌。","六四：月几望，馬匹亡，無咎。","九五：有孚攣如，無咎。","上九：翰音登于天，貞凶。"],"xiang_da":"澤上有風，中孚﹔君子以議獄緩死。","xiang_xiao":["初九虞吉，志未變也。","其子和之，中心愿也。","可鼓或罷，位不當也。","馬匹亡，絕類上也。","有孚攣如，位正當也。","翰音登于天，何可長也。中孚"],"composition":"兑上巽下","pinyin":"Duì shàng Xùn xià"},{"seq":62,"name":"雷山小過","hex":"䷽","gl":"YYNNYY","upn":"震","upa":"木","lon":"艮","loa":"土","gs":"木","tg":"土","yg":"木","jw":"亨,利貞。可小事,不可大事。","yuan":"此局很多，吾人常不自知陷於局中。\n\n一、感情困擾，擺脫不了情關，為情不顧一切，此小人也。\n\n二、肖猴，候姓人不忌。\n\n三、無法工作，神魂顛倒。\n\n四、常過失傷人，故婚事不成。","tuan":"小過，小者過而亨也。過以利貞，與時行也。柔得中，是以小事吉也。剛失位而不中，是以不可大事也。有飛鳥之象焉，有飛鳥遺之音，不宜上宜下，大吉﹔上逆而下順也。","yao":["初六：飛鳥以凶。","六二：過其祖，遇其妣﹔不及其君，遇其臣﹔無咎。","九三：弗過防之，從或戕之，凶。","九四：無咎，弗過遇之。往厲必戒，勿用永貞。","六五：密云不雨，自我西郊，公弋取彼在穴。","上六：弗遇過之，飛鳥離之，凶，是謂災眚。"],"xiang_da":"山上有雷，小過﹔君子以行過乎恭，喪過乎哀，用過乎儉。","xiang_xiao":["飛鳥以凶，不可如何也。","不及其君，臣不可過也。","從或戕之，凶如何也。","弗過遇之，位不當也。往厲必戒，終不可長也。","密云不雨，已上也。","弗遇過之，已亢也。小過"],"composition":"震上艮下","pinyin":"Zhèn shàng Gèn xià"},{"seq":63,"name":"水火既濟","hex":"䷾","gl":"YNYNYN","upn":"坎","upa":"水","lon":"离","loa":"火","gs":"水","tg":"火","yg":"水","jw":"亨小,利貞。初吉終亂。","yuan":"此局吾常用於化解困卦之局一、不重財貨，天性如此。\n\n二、官運人吉，從商亦得財，故財官雙美。\n\n三、科甲亦吉，利考試。\n\n四、先有子，後有婚，如加上命中有妾，則必主正房一子，偏房一子。\n\n五、婚姻會比同時生人慢八年，也常先有妾後有婚。\n\n故吾人知如此，常俟事業安定後，用雷卦化解婚姻問題。","tuan":"既濟，亨，小者亨也。利貞，剛柔正而位當也。初吉，柔得中也。終止則亂，其道窮也。","yao":["初九：曳其輪，濡其尾，無咎。","六二：婦喪其茀，勿逐，七日得。","九三：高宗伐鬼方，三年克之，小人勿用。","六四：繻有衣袽，終日戒。","九五：東鄰殺牛，不如西鄰之禴祭，實受其福。","上六：濡其首，厲。"],"xiang_da":"水在火上，既濟﹔君子以思患而預防之。","xiang_xiao":["曳其輪，義無咎也。","七日得，以中道也。","三年克之，憊也。","終日戒，有所疑也。","東鄰殺牛，不如西鄰之時也﹔實受其福，吉大來也。","濡其首厲，何可久也。"],"composition":"坎上离下","pinyin":"Kǎn shàng Lí xià"},{"seq":64,"name":"水火未濟","hex":"䷿","gl":"NYNYNY","upn":"离","upa":"火","lon":"坎","loa":"水","gs":"火","tg":"水","yg":"火","jw":"亨。小狐汔濟,濡其尾,無攸利。","yuan":"一、女身男態，性剛易怒。\n\n二、肖虎女子，必枯坐無成。\n\n三、劉、宋、高等姓人從武吉。\n\n四、婚事必不成，與同時生人婚時不同。\n\n五、從商求財是非多，甚而官司、爭執不下。","tuan":"未濟，亨﹔柔得中也。小狐汔濟，未出中也。濡其尾，無攸利﹔不續終也。雖不當位，剛柔應也。","yao":["初六：濡其尾，吝。","九二：曳其輪，貞吉。","六三：未濟，征凶，利涉大川。","九四：貞吉，悔亡，震用伐鬼方，三年有賞于大國。","六五：貞吉，無悔，君子之光，有孚，吉。","上九：有孚于飲酒，無咎，濡其首，有孚失是。"],"xiang_da":"火在水上，未濟﹔君子以慎辨物居方。","xiang_xiao":["濡其尾，亦不知極也。","九二貞吉，中以行正也。","未濟征凶，位不當也。","貞吉悔亡，志行也。","君子之光，其暉吉也。","飲酒濡首，亦不知節也。未濟"],"composition":"离上坎下","pinyin":"Lí shàng Kǎn xià"}];
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='"'?'&quot;':c==="'"?'&#39;':c; }); }
function glyphHTML(gl){
  return gl.split('').map(function(c){
    if(c==='N') return '<div class="line"><span class="bar full"></span></div>';
    return '<div class="line"><span class="bar half"></span><span class="bar half"></span></div>';
  }).join('');
}
function renderGrid(filter){
  var g = document.getElementById('grid');
  g.innerHTML='';
  var items = DATA.filter(function(d){ return !filter || d.name.indexOf(filter)>=0 || (d.composition&&d.composition.indexOf(filter)>=0) || (d.pinyin&&d.pinyin.toLowerCase().indexOf(filter.toLowerCase())>=0); });
  if(items.length===0){ g.innerHTML='<div class="empty">查無此卦</div>'; return; }
  items.forEach(function(d){
    var el=document.createElement('div');
    el.className='card';
    el.innerHTML='<div class="hex">'+esc(d.hex)+'</div>'+
      '<div class="seq">'+('0'+d.seq).slice(-2)+'</div>'+
      '<div class="nm">'+esc(d.name)+'</div>'+
      '<div class="tg">'+esc(d.upn)+esc(d.lon)+'</div>'+
      '<div class="go">查看</div>';
    el.onclick=function(){ showDetail(d.seq); };
    el.tabIndex=0; el.setAttribute('role','button'); el.setAttribute('aria-label', d.name);
    el.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); showDetail(d.seq); } });
    g.appendChild(el);
  });
}
function showDetail(seq){
  var d=DATA.find(function(x){ return x.seq===seq; });
  document.getElementById('d-name').textContent=d.name;
  document.getElementById('d-seq').textContent=('0'+d.seq).slice(-2)+' / 64';
  document.getElementById('d-hex').innerHTML=glyphHTML(d.gl);
  document.getElementById('d-pinyin').textContent=d.pinyin;
  document.getElementById('d-up').textContent='上 · '+d.upn;
  document.getElementById('d-upa').textContent='五行：'+d.upa;
  document.getElementById('d-lo').textContent='下 · '+d.lon;
  document.getElementById('d-loa').textContent='五行：'+d.loa;
  document.getElementById('d-chips').innerHTML=
    '<span class="chip">卦屬 '+esc(d.gs)+'</span><span class="chip">體卦 '+esc(d.tg)+'</span><span class="chip">用卦 '+esc(d.yg)+'</span>';
  document.getElementById('d-yuan').innerHTML = d.yuan.split(/\n\n+/).map(function(p){return p.trim();}).filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>';}).join('');
  document.getElementById('d-jw').textContent=d.jw;
  document.getElementById('d-tuan').textContent=d.tuan || '';
  document.getElementById('d-daxiang').textContent=d.xiang_da || '';
  document.getElementById('d-yao').innerHTML = (d.yao||[]).map(function(y, idx){
    var i=y.indexOf('：'); if(i<0) i=y.indexOf(':');
    var name=y.slice(0,i), text=y.slice(i+1);
    var xiao = (d.xiang_xiao && d.xiang_xiao[idx]) ? '<div class="yao-xiao">'+esc(d.xiang_xiao[idx])+'</div>' : '';
    return '<div class="yao-row"><div class="yao-name">'+esc(name)+'</div><div class="yao-body"><div class="yao-text">'+esc(text)+'</div>'+xiao+'</div></div>';
  }).join('');
  document.getElementById('index').style.display='none';
  var det=document.getElementById('detail');
  det.style.display='flex'; det.scrollTop=0;
}
function goIndex(){
  document.getElementById('detail').style.display='none';
  document.getElementById('index').style.display='flex';
}
document.getElementById('search').addEventListener('input',function(e){ renderGrid(e.target.value.trim()); });
renderGrid('');
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
